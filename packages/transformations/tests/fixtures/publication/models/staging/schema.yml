version: 2
models:
  - name: stg_fixture__observations
    description: Synthetic fixture observations before publication.
    config:
      meta:
        owner: Analytics Platform
        grain: One row per synthetic observation
        no_unique_key_reason: The single synthetic row is keyed in the mart.
    columns:
      - name: observation_id
        config:
          meta: {pii: false}
        data_type: bigint
        description: Stable synthetic observation identity.
      - name: observed_amount
        data_type: decimal(18, 2)
        description: Synthetic exact-decimal amount in USD.
        config:
          meta:
            pii: false
            currency: {column: currency_code}
      - name: currency_code
        config:
          meta: {pii: false}
        data_type: varchar
        description: ISO currency of the synthetic observation.
