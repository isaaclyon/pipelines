    - {shop_id: s, order_id: o1, refund_id: r1, total_refunded_shop_amount: 174.48, shop_currency_code: USD, presentment_currency_code: USD}
  - input: ref('stg_shopify_orders__refund_lines')
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, refund_line_item_id: li1, subtotal_shop_amount: 178.75, subtotal_shop_currency_code: USD, subtotal_presentment_currency_code: USD, total_tax_shop_amount: 10.73, total_tax_shop_currency_code: USD, total_tax_presentment_currency_code: USD}
  - input: ref('stg_shopify_orders__refund_adjustments')
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, adjustment_id: a1, adjustment_shop_amount: 15, adjustment_shop_currency_code: USD, adjustment_presentment_currency_code: USD, adjustment_tax_shop_amount: 0, adjustment_tax_shop_currency_code: USD, adjustment_tax_presentment_currency_code: USD}
  - input: ref('stg_loop_returns__headers')
    rows:
    - {shop_id: s, return_id: ret1, order_id: o1, return_state: closed, currency_code: USD, return_total_amount: 189.48, refund_amount: 174.48, handling_fee_amount: 15, gift_card_amount: 0, exchange_total_amount: 0, upsell_amount: 0, is_snapshot_complete: true}
    - {shop_id: s, return_id: ret2, order_id: o1, return_state: closed, currency_code: USD, return_total_amount: 189.48, refund_amount: 174.48, handling_fee_amount: 15, gift_card_amount: 0, exchange_total_amount: 0, upsell_amount: 0, is_snapshot_complete: true}
  - input: ref('stg_shopify_orders__refund_shipping_lines')
    rows: []
  - input: ref('stg_shopify_orders__refund_duties')
    rows: []
  expect:
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, loop_return_id: null, handling_fee_shop_amount: null, reporting_currency_code: USD, handling_fee_status: unresolved_ambiguous_loop_return}
