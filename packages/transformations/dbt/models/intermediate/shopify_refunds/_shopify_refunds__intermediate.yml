version: 2
models:
- name: int_shopify_refunds__handling_fees
  description: One row per Shopify refund with the return handling fee that Loop evidence proves
    inside that refund's adjustments. A fee is resolved only by one strict, unique match between a
    Shopify refund and a closed, complete, USD Loop return. Unmatched or ambiguous adjustments stay
    unresolved. Merchandise and refund totals are not changed; the parent model owns revenue.
  config:
    meta:
      grain: One row per Shopify refund
      key:
      - shop_id
      - order_id
      - refund_id
  data_tests:
  - unique_combination:
      name: shopify_refunds_handling_fees_unique_refund
      arguments:
        columns:
        - shop_id
        - order_id
        - refund_id
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: order_id
    data_type: varchar
    description: Source Shopify identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: refund_id
    data_type: varchar
    description: Source Shopify identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: loop_return_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Loop return identity that proves the handling fee. Null unless the refund has exactly
      one matching Loop return and the return has exactly one matching refund.
  - name: handling_fee_shop_amount
    data_type: decimal(38, 9)
    description: Positive return handling fee contained in this refund's adjustments. Zero only when the
      refund has no adjustment records and no Loop return with a nonzero or unknown fee on the same
      order. Null when the fee remains unresolved. In shop currency (USD).
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Currency of handling_fee_shop_amount. Every amount resolves only in USD, so this is
      always USD.
  - name: handling_fee_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Reason for the resolved or unresolved handling fee.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - matched_loop_handling_fee
          - no_adjustment_records
          - unresolved_no_adjustment_loop_fee
          - unresolved_no_loop_return
          - unresolved_ambiguous_loop_return
          - unresolved_ambiguous_refund
          - unresolved_loop_return_open
          - unresolved_loop_snapshot_incomplete
          - unresolved_other_loop_amount
          - unresolved_currency_not_usd
          - unresolved_handling_fee_not_positive
          - unresolved_return_total_mismatch
          - unresolved_refund_lines_mismatch
          - unresolved_other_refund_components
          - unresolved_adjustment_unknown
          - unresolved_adjustment_tax
          - unresolved_adjustment_sum_mismatch
unit_tests:
- name: known_handling_fee_matches_strict_loop_evidence
  description: The known +15 example resolves to its Loop return. A refund without adjustments and
    without a Loop fee is an explicit zero.
  model: int_shopify_refunds__handling_fees
  given:
  - input: ref('stg_shopify_orders__refunds')
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, total_refunded_shop_amount: 174.48, shop_currency_code: USD, presentment_currency_code: USD}
    - {shop_id: s, order_id: o2, refund_id: r2, total_refunded_shop_amount: 50, shop_currency_code: USD, presentment_currency_code: USD}
  - input: ref('stg_shopify_orders__refund_lines')
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, refund_line_item_id: li1, subtotal_shop_amount: 178.75, subtotal_shop_currency_code: USD, subtotal_presentment_currency_code: USD, total_tax_shop_amount: 10.73, total_tax_shop_currency_code: USD, total_tax_presentment_currency_code: USD}
  - input: ref('stg_shopify_orders__refund_adjustments')
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, adjustment_id: a1, adjustment_shop_amount: 15, adjustment_shop_currency_code: USD, adjustment_presentment_currency_code: USD, adjustment_tax_shop_amount: 0, adjustment_tax_shop_currency_code: USD, adjustment_tax_presentment_currency_code: USD}
  - input: ref('stg_loop_returns__headers')
    rows:
    - {shop_id: s, return_id: ret1, order_id: o1, return_state: closed, currency_code: USD, return_total_amount: 189.48, refund_amount: 174.48, handling_fee_amount: 15, gift_card_amount: 0, exchange_total_amount: 0, upsell_amount: 0, is_snapshot_complete: true}
  - input: ref('stg_shopify_orders__refund_shipping_lines')
    rows: []
  - input: ref('stg_shopify_orders__refund_duties')
    rows: []
  expect:
    rows:
    - {shop_id: s, order_id: o1, refund_id: r1, loop_return_id: ret1, handling_fee_shop_amount: 15, reporting_currency_code: USD, handling_fee_status: matched_loop_handling_fee}
    - {shop_id: s, order_id: o2, refund_id: r2, loop_return_id: null, handling_fee_shop_amount: 0, reporting_currency_code: USD, handling_fee_status: no_adjustment_records}
- name: duplicate_loop_returns_with_same_amounts_are_ambiguous
