    - {shop_id: s, order_id: o1, refund_id: r2, adjustment_id: a2, adjustment_shop_amount: 15, adjustment_shop_currency_code: USD, adjustment_presentment_currency_code: USD, adjustment_tax_shop_amount: 0, adjustment_tax_shop_currency_code: USD, adjustment_tax_presentment_currency_code: USD}
