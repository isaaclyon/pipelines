version: 2
models:
- name: int_shopify_customers__daily_mix
  description: >-
    Home-market D2C customer-day mix (docs/specs/20261101-new-repeat-customer-mix.md). One row per identified customer with at least one AOV-eligible, D2C, non-test, non-draft-marker, home-reporting-market order on the reporting-zone order date. A qualifying order on an earlier day in any market, channel or source proves repeat. No negative-history evidence exists yet, so every other customer is unknown and none is new. Unidentified and unresolved orders are disclosed separately in int_shopify_orders__daily_mix_coverage. Restates from the latest order evidence; not a complete population or a bound on the day's mix.
  config:
    meta:
      grain: One row per (shop_id, customer_id, order_date)
      key: [shop_id, customer_id, order_date]
  data_tests:
  - unique_combination:
      arguments:
        columns: [shop_id, customer_id, order_date]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: customer_id
    data_type: varchar
    description: Source Shopify customer identity on the order, within its shop. Latest observed value; no cross-customer matching or merge detection.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_date
    data_type: date
    description: Reporting-zone order date from processed_at, falling back to created_at, as defined by stg_shopify_orders__orders.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: qualifying_order_count
    data_type: bigint
    description: Number of this customer's qualifying home-market D2C orders on the order date; at least one.
    config:
      meta:
        pii: false
  - name: first_prior_qualifying_order_date
    data_type: date
    description: Earliest earlier order date with an AOV-eligible order in any market, channel or source; null unless the verdict is repeat.
    config:
      meta:
        pii: false
  - name: customer_mix_verdict
    data_type: varchar
    description: >-
      repeat when an AOV-eligible order exists on an earlier order date for this shop and customer, regardless of other missing or unresolved history; otherwise unknown. Orders on the same day never prove repeat. new is not emitted until negative-history coverage can be proven.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [repeat, unknown]
    config:
      meta:
        pii: false
  - name: unknown_reasons
    data_type: varchar
    description: >-
      Why an unknown verdict is unknown, pipe-separated and terminated; empty for repeat. unresolved_prior_eligibility when an earlier order's AOV eligibility is null; unproven_history_coverage whenever repeat is not proven, because no negative-history evidence exists.
    data_tests: [not_null]
    config:
      meta:
        pii: false
- name: int_shopify_orders__daily_mix_coverage
  description: >-
    Coverage disclosed beside int_shopify_customers__daily_mix, one row per shop and reporting-zone order date with at least one non-test, non-draft-marker, home-reporting-market order. Counts are outside the customer population and never join its denominator. A missing row means no in-scope orders were loaded, not zero coverage evidence.
  config:
    meta:
      grain: One row per (shop_id, order_date)
      key: [shop_id, order_date]
  data_tests:
  - unique_combination:
      arguments:
        columns: [shop_id, order_date]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_date
    data_type: date
    description: Reporting-zone order date from processed_at, falling back to created_at, as defined by stg_shopify_orders__orders.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: unidentified_qualifying_order_count
    data_type: bigint
    description: Orders that meet every daily population condition but have no customer ID. Orders, never customers.
    config:
      meta:
        pii: false
  - name: d2c_unknown_order_count
    data_type: bigint
    description: Orders in scope with unknown D2C classification and AOV eligibility that is true or unknown. They may be missing from the mix and from the unidentified count.
    config:
      meta:
        pii: false
  - name: eligibility_unknown_customer_count
    data_type: bigint
    description: Identified customers with D2C orders in scope whose AOV eligibility is unknown and with no AOV-eligible D2C order in scope that day, so they may be missing from the mix.
    config:
      meta:
        pii: false
