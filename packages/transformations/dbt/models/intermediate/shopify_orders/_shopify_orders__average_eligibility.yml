version: 2
models:
- name: int_shopify_orders__average_eligibility
  description: Metric-specific AOV and parent ASP prerequisites. Reuses revenue payment/commercial evidence without treating revenue eligibility as an average population.
  config:
    meta:
      grain: One row per (shop_id, order_id)
      key: [shop_id, order_id]
  data_tests:
  - unique_combination:
      arguments:
        columns: [shop_id, order_id]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_id
    data_type: varchar
    description: Source Shopify order identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: is_aov_eligible
    data_type: boolean
    description: >-
      Whole-order AOV verdict: true only for verified paid, commercially resolved merchandise scope with known non-gifted, non-replacement, non-exchange classification, no cancellation or full refund and positive net revenue excluding tax and handling fees. False for a proven exclusion; null for unresolved requirements.
    config:
      meta:
        pii: false
  - name: aov_exclusion_reasons
    data_type: varchar
    description: >-
      All proven AOV exclusions, pipe-separated and terminated; empty when none. Includes revenue exclusions plus cancelled_order, gifted_order, replacement_order, exchange_order, fully_refunded and nonpositive_commercial_value.
    config:
      meta:
        pii: false
  - name: aov_unresolved_requirements
    data_type: varchar
    description: >-
      All unknown AOV requirements, retained even for excluded orders. Includes revenue requirements plus revenue_evidence_missing, gifting_status_unknown, replacement_status_unknown, exchange_status_unknown, refund_status_unknown and retained_commercial_value_unknown; pipe-separated and terminated.
    config:
      meta:
        pii: false
  - name: is_asp_order_eligible
    data_type: boolean
    description: >-
      Parent prerequisites for ASP only, not a line verdict. Applies shared payment/commercial eligibility and excludes cancelled, gifted, replacement and exchange orders. Unknown required classification remains null. Does not require positive retained value or exclude full monetary refunds.
    config:
      meta:
        pii: false
  - name: asp_order_exclusion_reasons
    data_type: varchar
    description: >-
      All shared revenue exclusions plus cancelled_order, gifted_order, replacement_order and exchange_order, pipe-separated and terminated.
    config:
      meta:
        pii: false
  - name: asp_order_unresolved_requirements
    data_type: varchar
    description: >-
      All shared revenue requirements plus revenue_evidence_missing, gifting_status_unknown, replacement_status_unknown and exchange_status_unknown, pipe-separated and terminated; retained for excluded parents.
    config:
      meta:
        pii: false
- name: int_shopify_order_lines__asp_eligibility
  description: Line-specific ASP population preserving source line identity, amount-only refunded units and zero-unit residual value. No division or average is calculated here.
  config:
    meta:
      grain: One row per (shop_id, order_id, line_item_id)
      key: [shop_id, order_id, line_item_id]
  data_tests:
  - unique_combination:
      arguments:
        columns: [shop_id, order_id, line_item_id]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_id
    data_type: varchar
    description: Source Shopify order identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: line_item_id
    data_type: varchar
    description: Source Shopify line_item identity, scoped by the preceding key fields.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: is_asp_eligible
    data_type: boolean
    description: >-
      Line ASP verdict: true only for resolved paid merchandise scope, known net quantity and line sales/discount/refund allocations, with no test, cancellation, gifting, replacement or exchange exclusion. Amount-only full refunds and zero-unit residual values remain eligible. False for proven exclusion; null when required evidence is unknown.
    config:
      meta:
        pii: false
  - name: asp_exclusion_reasons
    data_type: varchar
    description: >-
      All proven ASP exclusions, pipe-separated and terminated. Includes shared revenue and parent cancellation/gifting/replacement/exchange exclusions plus gift_card_item. Does not inherit AOV full-refund or positive-value requirements.
    config:
      meta:
        pii: false
  - name: asp_unresolved_requirements
    data_type: varchar
    description: >-
      All unknown ASP requirements, retained even for excluded lines; pipe-separated and terminated. Includes shared parent payment/commercial/classification requirements plus parent_eligibility_missing, gift_card_status_unknown, net_quantity_unknown and line_commercial_value_unknown.
    config:
      meta:
        pii: false
