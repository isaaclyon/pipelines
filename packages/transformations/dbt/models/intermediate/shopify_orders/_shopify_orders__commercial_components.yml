version: 2
models:
- name: int_shopify_sales__ledger
  description: Signed Shopify sales ledger, one row per sale. Components are tax-exclusive USD amounts
    in the shop currency; unresolved sales keep source fields and NULL components.
  config:
    meta:
      grain: One row per (shop_id, order_id, agreement_id, sale_id)
      key:
      - shop_id
      - order_id
      - agreement_id
      - sale_id
  data_tests:
  - unique_combination:
      name: shopify_sales_ledger_unique_sale
      arguments:
        columns:
        - shop_id
        - order_id
        - agreement_id
        - sale_id
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests:
    - not_null
  - name: order_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify order identity.
    data_tests:
    - not_null
  - name: agreement_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify sales agreement identity.
    data_tests:
    - not_null
  - name: sale_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify sale identity within the agreement.
    data_tests:
    - not_null
  - name: agreement_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Concrete Shopify agreement type; null when the parent agreement is missing.
  - name: agreement_reason
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify agreement reason as reported, such as ORDER, ORDER_EDIT or RETURN.
  - name: agreement_refund_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Refund identity carried by the parent agreement; null when the agreement has none.
  - name: agreement_happened_at
    data_type: timestamp
    description: When the parent agreement happened, in UTC.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: sale_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Concrete Shopify sale type, such as ProductSale.
  - name: action_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Sale action type as reported by staging.
  - name: line_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Sale line type as reported by staging.
  - name: signed_quantity
    config:
      meta: {pii: false}
    data_type: bigint
    description: Signed quantity Shopify reports for the sale; null when the sale has none.
  - name: line_item_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Direct order line assignment; null for sales Shopify does not assign to a line.
  - name: shipping_line_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping line identity for shipping sales; null otherwise.
  - name: duty_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Duty identity for duty sales; null otherwise.
  - name: fee_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Fee identity for fee sales; null otherwise.
  - name: fee_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source fee type for fee sales; null otherwise.
  - name: additional_fee_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Additional fee identity for additional-fee sales; null otherwise.
  - name: is_gift_card_line
    config:
      meta: {pii: false}
    data_type: boolean
    description: Whether the assigned order line is a gift card; null when no order line matches.
  - name: sale_kind
    config:
      meta: {pii: false}
    data_type: varchar
    description: Component kind from the sale type and gift-card line evidence, or unknown.
  - name: resolution_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: First failed check for the sale, or resolved. Unresolved sales carry NULL components.
  - name: is_resolved
    config:
      meta: {pii: false}
    data_type: boolean
    description: Whether every check passed and the components are populated.
  - name: sale_total_shop_amount
    data_type: decimal(38, 9)
    description: Source sale total, including tax, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: sale_tax_shop_amount
    data_type: decimal(38, 9)
    description: Source total tax of the sale, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: source_discount_before_taxes_shop_amount
    data_type: decimal(38, 9)
    description: Source discount before taxes, preserved as reported.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: sale_net_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive sale total, equal to the source total minus the source total tax.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: gross_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Merchandise value before discount for ORDER and UPDATE product sales; zero for other
      sales.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise discount as a negative effect on net sales.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise refund from RETURN product sales, net of discount, as a negative
      value.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: gift_card_liability_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive gift-card sale value; a gift-card return is negative.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive shipping charged by ORDER and UPDATE shipping sales.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_refund_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive shipping refunded by RETURN shipping sales, as a negative value.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: duty_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive duty sale value, signed as reported.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: return_shipping_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive return shipping fee from a fee sale whose fee type names return shipping.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unfinalized_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive fee sale that is not a return shipping fee. It needs finalized Loop evidence
      before it is reported as a fee.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: additional_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive additional fee sale value, signed as reported.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Governed reporting currency for every amount in this model; always USD.
  - name: handling_fee_shop_amount
    data_type: decimal(38, 9)
    description: Adjustment sale proven by one finalized Loop handling-fee match. Excluded from merchandise
      and net revenue.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
- name: int_shopify_order_lines__commercial_components
  description: One row per source order line, with direct line assignments from the sales ledger. Lines
    without sale evidence or with an unresolved sale have NULL amounts.
  config:
    meta:
      grain: One row per (shop_id, order_id, line_item_id)
      key:
      - shop_id
      - order_id
      - line_item_id
  data_tests:
  - unique_combination:
      name: shopify_order_lines_commercial_unique_line
      arguments:
        columns:
        - shop_id
        - order_id
        - line_item_id
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests:
    - not_null
  - name: order_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify order identity.
    data_tests:
    - not_null
  - name: line_item_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify order line identity.
    data_tests:
    - not_null
  - name: is_gift_card_line
    config:
      meta: {pii: false}
    data_type: boolean
    description: Whether the source order line is a gift card.
  - name: line_sale_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of ledger sales directly assigned to the line.
  - name: unresolved_line_sale_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of directly assigned ledger sales that did not resolve.
  - name: line_commercial_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: resolved, unresolved_sales or no_sale_evidence.
  - name: gross_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Merchandise value before discount assigned to the line; NULL unless resolved.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise discount assigned to the line, as a negative effect.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise refund assigned to the line, net of discount, as a negative
      value.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: net_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Gross merchandise plus discount plus merchandise refund for the line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: gift_card_liability_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive gift-card sale value assigned to the line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_tax_shop_amount
    data_type: decimal(38, 9)
    description: Source tax on merchandise sales assigned to the line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Governed reporting currency for every amount in this model; always USD.
- name: int_shopify_orders__payment_reconciliation
  description: One row per order with payment transactions. Reconciles money movement only; failed-payment
    reversals never become merchandise or shipping refunds.
  config:
    meta:
      grain: One row per (shop_id, order_id)
      key:
      - shop_id
      - order_id
  data_tests:
  - unique_combination:
      name: shopify_payment_reconciliation_unique_order
      arguments:
        columns:
        - shop_id
        - order_id
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests:
    - not_null
  - name: order_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify order identity.
    data_tests:
    - not_null
  - name: payment_transaction_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of payment transactions for the order.
  - name: failed_payment_attempt_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of failed or errored sale, capture or authorization attempts.
  - name: payment_currency_unresolved_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of classified payment transactions that are not in USD; their amounts are NULL.
  - name: unresolved_refund_payment_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of successful refund transactions that are neither linked refunds nor identified
      reversals.
  - name: collected_shop_amount
    data_type: decimal(38, 9)
    description: Successful sale and capture amounts, including gift-card tender, before fees.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: refund_object_payment_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund amounts linked to a Shopify refund object.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: failed_attempt_reversal_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund amounts identified as reversals of failed payment attempts; excluded
      from commercial refunds.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unresolved_refund_payment_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund amounts that are not yet classified; excluded from commercial refunds.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Governed reporting currency for every amount in this model; always USD.
  - name: unresolved_payment_activity_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Unclassified payment activity or money movement with missing or negative amounts.
- name: int_shopify_orders__commercial_components
  description: One row per source order with commercial components, refund and adjustment reconciliation,
    and payment reconciliation. Net money is NULL unless the order status is complete.
  config:
    meta:
      grain: One row per (shop_id, order_id)
      key:
      - shop_id
      - order_id
  data_tests:
  - unique_combination:
      name: shopify_commercial_components_unique_order
      arguments:
        columns:
        - shop_id
        - order_id
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests:
    - not_null
  - name: order_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source Shopify order identity.
    data_tests:
    - not_null
  - name: commercial_resolution_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: First blocking reason, or complete. Values are no_agreement_evidence, no_order_agreement,
      no_sale_evidence, unresolved_sales, unresolved_refund, unfinalized_fee, unresolved_adjustment, unresolved_payment_refund,
      unresolved_payment_currency and complete.
  - name: is_commercial_resolved
    config:
      meta: {pii: false}
    data_type: boolean
    description: Whether commercial_resolution_status is complete.
  - name: agreement_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of sales agreements for the order.
  - name: sale_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of ledger sales for the order.
  - name: unresolved_sale_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of ledger sales that did not resolve.
  - name: refund_object_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of Shopify refund objects for the order.
  - name: refund_without_agreement_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of refund objects with no sales agreement carrying the same refund identity.
  - name: refund_object_unresolved_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of refund objects that are not in USD or have no amount.
  - name: unfinalized_fee_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of fee sales that need finalized Loop evidence.
  - name: unresolved_adjustment_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of refund adjustments. Each one is unexplained until finalized evidence explains
      it.
  - name: non_gift_card_line_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of source order lines that are not gift cards; a parent allocation input.
  - name: unknown_gift_card_line_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of source order lines whose gift-card flag is missing.
  - name: unresolved_refund_payment_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of successful refund transactions that are not yet classified.
  - name: gross_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Merchandise value before discount for the order; NULL when sales are not fully known.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise discount for the order, as a negative effect.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive merchandise refund for the order, net of discount, as a negative value.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: net_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Gross merchandise plus discount plus merchandise refund; NULL unless the status is complete.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive shipping charged for the order.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_refund_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive shipping refunded for the order, as a negative value.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: net_shipping_shop_amount
    data_type: decimal(38, 9)
    description: Shipping plus shipping refund; NULL unless the status is complete.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: net_revenue_shop_amount
    data_type: decimal(38, 9)
    description: Net merchandise plus net shipping; NULL unless the status is complete. Excludes fees.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: duty_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive duty sales for the order, signed as reported.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: gift_card_liability_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive gift-card sale value for the order; excluded from merchandise.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: tax_shop_amount
    data_type: decimal(38, 9)
    description: Source tax across resolved sales for the order.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: return_shipping_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive return shipping fee for the order.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unfinalized_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive fee sales that need finalized Loop evidence. Not a handling fee.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: additional_fee_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive additional fee sales for the order.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unresolved_adjustment_shop_amount
    data_type: decimal(38, 9)
    description: Sum of refund adjustment amounts in USD. Unexplained; not a merchandise, shipping or
      fee amount.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unresolved_adjustment_tax_shop_amount
    data_type: decimal(38, 9)
    description: Sum of refund adjustment tax amounts in USD. Unexplained.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unassigned_shipping_shop_amount
    data_type: decimal(38, 9)
    description: Shipping charged for the order with no direct line assignment; the parent allocates it.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unassigned_shipping_refund_shop_amount
    data_type: decimal(38, 9)
    description: Shipping refunded for the order with no direct line assignment; the parent allocates
      it.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: ledger_total_shop_amount
    data_type: decimal(38, 9)
    description: Sum of resolved sale totals including tax; compare with the current order total.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: ledger_header_difference_shop_amount
    data_type: decimal(38, 9)
    description: Ledger total minus the current order total in the source header. Zero means the ledger
      reconciles.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: refund_object_shop_amount
    data_type: decimal(38, 9)
    description: Sum of refund object totals in USD for the order.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: refund_linked_sale_total_shop_amount
    data_type: decimal(38, 9)
    description: Tax-inclusive sale totals on sales agreements that carry a refund identity.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: refund_agreement_difference_shop_amount
    data_type: decimal(38, 9)
    description: Refund object total plus refund-linked sale totals. Zero means the refund objects match
      the agreements.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: successful_collected_shop_amount
    data_type: decimal(38, 9)
    description: Successful collected payments for the order, including gift-card tender.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: successful_refund_object_payment_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund payments linked to a Shopify refund object.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: failed_attempt_reversal_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund payments identified as reversals of failed attempts; excluded from
      commercial refunds.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unresolved_refund_payment_shop_amount
    data_type: decimal(38, 9)
    description: Successful refund payments that are not yet classified; excluded from commercial refunds.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Governed reporting currency for every amount in this model; always USD.
  - name: unresolved_handling_fee_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Refunds whose handling-fee evidence remains unresolved.
  - name: handling_fee_shop_amount
    data_type: decimal(38, 9)
    description: Finalized handling fees in USD, separate from merchandise, shipping and net revenue.
      Unknown when any refund fee is unresolved.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: unresolved_payment_activity_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Unclassified payment activity or money movement with missing or negative amounts.
  - name: payment_transaction_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Observed payment transactions; zero does not establish payment collection.
- name: int_shopify_refunds__commercial_reconciliation
  description: Refund-level commercial and payment reconciliation. Opposite differences never cancel across
    refunds.
  config:
    meta:
      grain: One row per Shopify refund
      key: &id001
      - shop_id
      - order_id
      - refund_id
  data_tests:
  - unique_combination:
      name: shopify_refund_commercial_reconciliation_unique
      arguments:
        columns: *id001
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop id.
    data_tests:
    - not_null
  - name: order_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Order id.
    data_tests:
    - not_null
  - name: refund_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Refund id.
    data_tests:
    - not_null
  - name: shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source refund shop currency.
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Currency of resolved commercial sales; always USD.
  - name: total_refunded_shop_amount
    data_type: decimal(38, 9)
    description: Source refund total, without conversion.
    config:
      meta:
        pii: false
        currency:
          column: shop_currency_code
  - name: commercial_sale_total_shop_amount
    data_type: decimal(38, 9)
    description: Resolved signed sales assigned to this refund through source identity or a unique amount
      match.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: without_agreement_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: One when is without agreement, otherwise zero.
  - name: component_difference_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: One when has component difference, otherwise zero.
  - name: payment_difference_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: One when has payment difference, otherwise zero.
- name: int_shopify_transactions__payment_flows
  description: One row per payment transaction with shared cash-flow classification and positively
    identified failed-attempt pairs. Classification alone does not prove full payment or eligibility.
  config:
    meta:
      grain: One row per (shop_id, order_id, transaction_id)
      key: [shop_id, order_id, transaction_id]
  data_tests:
  - unique_combination:
      name: shopify_payment_flows_unique_transaction
      arguments:
        columns: [shop_id, order_id, transaction_id]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_id
    data_type: varchar
    description: Source Shopify order identity within the shop.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: transaction_id
    data_type: varchar
    description: Source Shopify transaction identity within the order.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: parent_transaction_id
    data_type: varchar
    description: Parent transaction referenced by this movement; null when absent.
    config:
      meta:
        pii: false
  - name: occurred_at
    data_type: timestamp
    description: Shopify processed instant, falling back to the created instant, in UTC.
    config:
      meta:
        pii: false
        temporal: {kind: instant, timezone: UTC}
  - name: kind
    data_type: varchar
    description: Normalized Shopify transaction kind; unknown kinds remain visible.
    config:
      meta:
        pii: false
  - name: status
    data_type: varchar
    description: Normalized Shopify transaction status; unknown statuses remain visible.
    config:
      meta:
        pii: false
  - name: shop_currency_code
    data_type: varchar
    description: Source currency of the transaction shop-money amount.
    config:
      meta:
        pii: false
  - name: transaction_shop_amount
    data_type: decimal(38, 9)
    description: Source transaction amount without derived signs; missing and negative amounts remain visible.
    config:
      meta:
        pii: false
        currency: {column: shop_currency_code}
  - name: is_failed_attempt_collection
    data_type: boolean
    description: Whether this collection has a successful, positively identified failed-attempt reversal
      without a refund object. Both movements must be excluded from payment-history eligibility evidence.
    config:
      meta:
        pii: false
  - name: payment_flow_class
    data_type: varchar
    description: Collection, refund_object, failed_attempt_reversal, unresolved_refund, noncash or
      unclassified. Refund-object linkage takes precedence over failed-attempt reversal proof.
    config:
      meta:
        pii: false
  - name: failed_payment_attempt_count
    data_type: integer
    description: One for a failed or errored sale, capture or authorization; zero otherwise.
    config:
      meta:
        pii: false
- name: int_shopify_orders__payment_history
  description: One row per order with conservative payment-history proof from reconciled tax-inclusive
    sales obligations and successful net cash. Refund cash and its agreement credit share a logical
    event time. Return agreements and unreconciled source evidence remain unresolved.
  config:
    meta:
      grain: One row per (shop_id, order_id)
      key: [shop_id, order_id]
  data_tests:
  - unique_combination:
      name: shopify_payment_history_unique_order
      arguments:
        columns: [shop_id, order_id]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_id
    data_type: varchar
    description: Source Shopify order identity within the shop.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: source_observed_at
    data_type: timestamp
    description: UTC observation of the parent order that owns this transaction and agreement snapshot.
    config:
      meta:
        pii: false
        temporal: {kind: instant, timezone: UTC}
  - name: is_payment_observation_complete
    data_type: boolean
    description: Whether parent observation lineage is present at revision 3 or later and its EXACT
      transaction count matches the retained transaction rows. Does not prove freshness or source-window coverage.
    config:
      meta:
        pii: false
  - name: is_payment_obligation_verified
    data_type: boolean
    description: Whether one dated initial ORDER and supported dated changes reconcile to original and
      current order totals in USD using the validated ledger handling-fee header adjustment.
      Event obligations retain those fees. Unsupported RETURN agreements remain false.
    config:
      meta:
        pii: false
  - name: is_payment_chronology_resolved
    data_type: boolean
    description: Whether cash movements are classified, amounts and times are usable, refund links
      resolve to one agreement, no refund awaits settlement, and chronological retained cash never becomes negative.
    config:
      meta:
        pii: false
  - name: reporting_currency_code
    data_type: varchar
    description: Currency of verified payment amounts; always USD.
    config:
      meta:
        pii: false
  - name: has_fully_paid_current_obligation
    data_type: boolean
    description: Whether net cash covers a verified obligation at a logical event on or after the latest
      order edit. Later refunds preserve proof; a new unpaid edit resets it. Null for incomplete proof.
    config:
      meta:
        pii: false
  - name: net_customer_payment_shop_amount
    data_type: decimal(38, 9)
    description: Successful collections less customer refunds, excluding proven failed-attempt reversal
      pairs; null when observation or chronology is unresolved.
    config:
      meta:
        pii: false
        currency: {column: reporting_currency_code}
  - name: is_partially_refunded
    data_type: boolean
    description: Whether successful customer refunds exist with positive net retained payment;
      null for unresolved observation or payment chronology.
    config:
      meta:
        pii: false
  - name: is_fully_refunded
    data_type: boolean
    description: Whether previous collections and successful customer refunds leave zero net retained
      payment; null for unresolved observation or payment chronology.
    config:
      meta:
        pii: false
- name: int_shopify_orders__revenue_eligibility
  description: Revenue-only eligibility at order grain with all proven exclusions and unresolved
    requirements retained independently. Cancellation, gifting, replacement, exchange and channel
    membership do not independently exclude revenue. AOV is not implemented here.
  config:
    meta:
      grain: One row per (shop_id, order_id)
      key: [shop_id, order_id]
  data_tests:
  - unique_combination:
      name: shopify_revenue_eligibility_unique_order
      arguments:
        columns: [shop_id, order_id]
  columns:
  - name: shop_id
    data_type: varchar
    description: Source Shopify shop identity.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: order_id
    data_type: varchar
    description: Source Shopify order identity within the shop.
    data_tests: [not_null]
    config:
      meta:
        pii: false
  - name: is_revenue_eligible
    data_type: boolean
    description: True for resolved revenue scope with verified full payment; false for any proven
      exclusion; null when required evidence is unknown without a proven exclusion.
    config:
      meta:
        pii: false
  - name: revenue_exclusion_reasons
    data_type: varchar
    description: All proven exclusion identifiers separated and terminated by a pipe; empty when none.
      Identifiers are test_order, gift_card_only and payment_not_fully_collected.
    config:
      meta:
        pii: false
  - name: revenue_unresolved_requirements
    data_type: varchar
    description: All unresolved requirement identifiers separated and terminated by a pipe; empty when
      none. Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown,
      payment_chronology_unresolved and commercial_value_unknown. Retained even for excluded orders.
    config:
      meta:
        pii: false
