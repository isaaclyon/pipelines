version: 2
models:
- name: int_shopify_orders__line_rollups
  description: Order lines rolled up to one row per order with lines. Orders without lines have no row;
    fct_orders fills zeros.
  config:
    meta:
      grain: One row per Shopify order that has at least one line
      key:
      - shop_id
      - order_id
  data_tests:
  - unique_combination:
      name: shopify_line_rollups_unique_order
      arguments:
        columns:
        - shop_id
        - order_id
  columns:
  - name: shop_id
    data_type: varchar
    description: Shopify shop identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: order_id
    data_type: varchar
    description: Shopify order identity within the shop.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: line_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of source order lines, including removed and refunded lines. Zero when the order
      has no lines.
  - name: gross_ordered_quantity
    config:
      meta: {pii: false}
    data_type: bigint
    description: Units ordered across all lines before cancellations, removals and refunds.
  - name: original_line_value_shop_amount
    data_type: decimal(38, 9)
    description: Sum of quantity times original unit price across lines, before any discounts, edits or
      refunds. Not gross sales. In shop currency (USD).
    config:
      meta:
        pii: false
        currency:
          column: shop_currency_code
          model: stg_shopify_orders__orders
          join:
            shop_id: shop_id
            order_id: order_id
          test: shopify_orders_currencies_match
  - name: original_line_value_presentment_amount
    data_type: decimal(38, 9)
    description: original_line_value in presentment currency.
    config:
      meta:
        pii: false
        currency:
          column: presentment_currency_code
          model: stg_shopify_orders__orders
          join:
            shop_id: shop_id
            order_id: order_id
          test: shopify_orders_currencies_match
- name: int_shopify_orders__classifications
  description: Channel and order-characteristic flags for every staged order, following the order marts
    specification. Flags are nullable; true is an established match, false a conclusively evaluated
    non-match and null unavailable evidence. D2C is the residual of the commercial rules.
  config:
    meta:
      grain: One row per Shopify order
      key:
      - shop_id
      - order_id
  data_tests:
  - unique_combination:
      name: shopify_classifications_unique_order
      arguments:
        columns:
        - shop_id
        - order_id
  columns:
  - name: shop_id
    data_type: varchar
    description: Shopify shop identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity: {kind: source, source: shopify}
  - name: order_id
    data_type: varchar
    description: Shopify order identity within the shop.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity: {kind: source, source: shopify}
  - name: has_classification_evidence
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when the latest observation selected tags, discount codes and order email
      (extraction revision 2 or later). False means tag, code and email rules are unknown.
    data_tests:
    - not_null
  - name: has_retail_evidence
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when the normalized source name is pos.
    data_tests:
    - not_null
  - name: has_specialty_evidence
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when a specialty tag or discount code matches, even when retail wins.
      Null without classification evidence.
  - name: has_bulk_evidence
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when a bulk tag matches, even when a higher-priority channel wins. Null without
      classification evidence.
  - name: has_gifting_tag_evidence
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when a gifting tag matches. Null without classification evidence.
  - name: is_retail
    config:
      meta: {pii: false}
    data_type: boolean
    description: Retail commercial channel. Every Shopify POS order is retail.
    data_tests:
    - not_null
  - name: is_specialty
    config:
      meta: {pii: false}
    data_type: boolean
    description: Specialty commercial channel, after retail precedence. Null when unresolved.
  - name: is_bulk
    config:
      meta: {pii: false}
    data_type: boolean
    description: Bulk commercial channel, after retail and specialty precedence. Null when unresolved.
  - name: is_commercial
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when retail, specialty or bulk is true. Null when no channel is established and
      any is unresolved.
  - name: is_d2c
    config:
      meta: {pii: false}
    data_type: boolean
    description: Direct-to-consumer channel. True when every commercial rule was evaluated with no match;
      the negation of is_commercial, including null.
  - name: is_employee_order
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when the order email domain is exactly one of the employee_email_domains project
      var. Null when the email or classification evidence is unavailable.
  - name: is_gifted
    config:
      meta: {pii: false}
    data_type: boolean
    description: True for a gifting tag or a non-test, non-replacement employee order whose
      original whole-order total after discounts, including shipping and tax, is zero. Later edits or
      refunds do not establish gifting. Null when required evidence is unavailable or invalid and no
      decisive condition resolves the rule.
  - name: is_replacement
    config:
      meta: {pii: false}
    data_type: boolean
    description: Replacement tag or discount code. Null without classification
      evidence.
  - name: is_exchange
    config:
      meta: {pii: false}
    data_type: boolean
    description: Exchange tag or discount code. Null without
      classification evidence.
  - name: is_shopify_collective
    config:
      meta: {pii: false}
    data_type: boolean
    description: Shopify Collective tag. Null without classification evidence.
  - name: is_broadcast
    config:
      meta: {pii: false}
    data_type: boolean
    description: Broadcast tag. Null without classification evidence.
unit_tests:
- name: line_rollups_sum_exact_decimals_per_order
  description: 'Lines roll up per order without rounding: 2 x 10.005 + 1 x 0.333333333 keeps all nine
    decimal places, and repeated products stay separate lines.'
  model: int_shopify_orders__line_rollups
  given:
  - input: ref('stg_shopify_orders__order_lines')
    rows:
    - shop_id: s
      order_id: a
      line_item_id: '1'
      original_unit_price_shop_amount: 10.005
      original_unit_price_presentment_amount: 9.1
      order_line_quantity: 2
    - shop_id: s
      order_id: a
      line_item_id: '2'
      original_unit_price_shop_amount: 0.333333333
      original_unit_price_presentment_amount: 0.3
      order_line_quantity: 1
    - shop_id: s
      order_id: a
      line_item_id: '3'
      original_unit_price_shop_amount: 0.333333333
      original_unit_price_presentment_amount: 0.3
      order_line_quantity: 1
    - shop_id: s
      order_id: b
      line_item_id: '4'
      original_unit_price_shop_amount: 0
      original_unit_price_presentment_amount: 0
      order_line_quantity: 3
  expect:
    rows:
    - shop_id: s
      order_id: a
      line_count: 3
      gross_ordered_quantity: 4
      original_line_value_shop_amount: 20.676666666
      original_line_value_presentment_amount: 18.8
    - shop_id: s
      order_id: b
      line_count: 1
      gross_ordered_quantity: 3
      original_line_value_shop_amount: 0
      original_line_value_presentment_amount: 0
- name: classifications_resolve_commercial_precedence
  description: 'Fixture cases C01 to C04. POS wins over specialty and bulk evidence, specialty wins over
    bulk, and losing evidence stays visible. Collective with bulk is commercial, not D2C. Broadcast or
    Collective without a commercial match is D2C. Independent characteristics survive precedence.'
  model: int_shopify_orders__classifications
  overrides:
    vars: {employee_email_domains: [brand.example]}
  given:
  - input: ref('stg_shopify_orders__orders')
    rows:
    - {shop_id: s, order_id: c01, source_name: ' POS ', extraction_revision: 3, is_test: false, order_email: a@brand.example}
    - {shop_id: s, order_id: c02, source_name: web, extraction_revision: 3, is_test: false, order_email: b@brand.example}
    - {shop_id: s, order_id: c03, source_name: web, extraction_revision: 3, is_test: false, order_email: c@example.com}
    - {shop_id: s, order_id: c04, source_name: web, extraction_revision: 3, is_test: false, order_email: d@example.com}
    - {shop_id: s, order_id: code, source_name: web, extraction_revision: 2, is_test: false, order_email: e@example.com}
  - input: ref('stg_shopify_orders__order_tags')
    rows:
    - {shop_id: s, order_id: c01, normalized_tag: wholesale partner}
    - {shop_id: s, order_id: c01, normalized_tag: bulk}
    - {shop_id: s, order_id: c01, normalized_tag: replacement}
    - {shop_id: s, order_id: c02, normalized_tag: wholesale partner}
    - {shop_id: s, order_id: c02, normalized_tag: vera-bulk}
    - {shop_id: s, order_id: c03, normalized_tag: bulk order}
    - {shop_id: s, order_id: c03, normalized_tag: shopify collective}
    - {shop_id: s, order_id: c04, normalized_tag: broadcast march 2026}
    - {shop_id: s, order_id: c04, normalized_tag: shopify collective}
    - {shop_id: s, order_id: c04, normalized_tag: attn-req-gift-card-review}
  - input: ref('stg_shopify_orders__order_discount_codes')
    rows:
    - {shop_id: s, order_id: code, normalized_discount_code: wholesale}
    - {shop_id: s, order_id: c03, normalized_discount_code: wholesale-10}
  expect:
    rows:
    - {order_id: c01, has_retail_evidence: true, has_specialty_evidence: true, has_bulk_evidence: true,
      is_retail: true, is_specialty: false, is_bulk: false, is_commercial: true, is_d2c: false,
      is_employee_order: true, is_replacement: true, is_gifted: false, is_shopify_collective: false}
    - {order_id: c02, has_retail_evidence: false, has_specialty_evidence: true, has_bulk_evidence: true,
      is_retail: false, is_specialty: true, is_bulk: false, is_commercial: true, is_d2c: false,
      is_employee_order: true, is_replacement: false, is_gifted: null, is_shopify_collective: false}
    - {order_id: c03, has_retail_evidence: false, has_specialty_evidence: false, has_bulk_evidence: true,
      is_retail: false, is_specialty: false, is_bulk: true, is_commercial: true, is_d2c: false,
      is_employee_order: false, is_replacement: false, is_gifted: false, is_shopify_collective: true}
    - {order_id: c04, has_retail_evidence: false, has_specialty_evidence: false, has_bulk_evidence: false,
      is_retail: false, is_specialty: false, is_bulk: false, is_commercial: false, is_d2c: true,
      is_employee_order: false, is_replacement: false, is_gifted: false, is_shopify_collective: true}
    - {order_id: code, has_retail_evidence: false, has_specialty_evidence: true, has_bulk_evidence: false,
      is_retail: false, is_specialty: true, is_bulk: false, is_commercial: true, is_d2c: false,
      is_employee_order: false, is_replacement: false, is_gifted: false, is_shopify_collective: false}
- name: classifications_keep_missing_evidence_unknown
  description: 'Fixture case C06. Revision-1 observations never selected tags, codes or email, so their
    rules are unknown and D2C is not manufactured; POS still establishes retail. A revision-2 order with
    no tag or code rows has empty lists and resolves D2C. A missing email at revision 2 leaves the
    employee rule unknown.'
  model: int_shopify_orders__classifications
  overrides:
    vars: {employee_email_domains: [brand.example]}
  given:
  - input: ref('stg_shopify_orders__orders')
    rows:
    - {shop_id: s, order_id: old_web, source_name: web, extraction_revision: 1, is_test: false, order_email: null}
    - {shop_id: s, order_id: old_pos, source_name: pos, extraction_revision: 1, is_test: false, order_email: null}
    - {shop_id: s, order_id: empty, source_name: web, extraction_revision: 2, is_test: false, order_email: f@example.com}
    - {shop_id: s, order_id: no_email, source_name: web, extraction_revision: 3, is_test: false, order_email: null}
  - input: ref('stg_shopify_orders__order_tags')
    rows: []
  - input: ref('stg_shopify_orders__order_discount_codes')
    rows: []
  expect:
    rows:
    - {order_id: old_web, has_classification_evidence: false, has_specialty_evidence: null,
      has_bulk_evidence: null, is_retail: false, is_specialty: null, is_bulk: null, is_commercial: null,
      is_d2c: null, is_employee_order: null, is_gifted: null, is_replacement: null, is_exchange: null,
      is_shopify_collective: null, is_broadcast: null}
    - {order_id: old_pos, has_classification_evidence: false, has_specialty_evidence: null,
      has_bulk_evidence: null, is_retail: true, is_specialty: false, is_bulk: false, is_commercial: true,
      is_d2c: false, is_employee_order: null, is_gifted: null, is_replacement: null, is_exchange: null,
      is_shopify_collective: null, is_broadcast: null}
    - {order_id: empty, has_classification_evidence: true, has_specialty_evidence: false,
      has_bulk_evidence: false, is_retail: false, is_specialty: false, is_bulk: false,
      is_commercial: false, is_d2c: true, is_employee_order: false, is_gifted: false,
      is_replacement: false, is_exchange: false, is_shopify_collective: false, is_broadcast: false}
    - {order_id: no_email, has_classification_evidence: true, has_specialty_evidence: false,
      has_bulk_evidence: false, is_retail: false, is_specialty: false, is_bulk: false,
      is_commercial: false, is_d2c: true, is_employee_order: null, is_gifted: null,
      is_replacement: false, is_exchange: false, is_shopify_collective: false, is_broadcast: false}
- name: classifications_match_characteristics_exactly
  description: 'Employee matches the exact email domain only. Replacement, exchange and gifting follow
    the approved tags and codes and can overlap. Broadcast uses the configured prefix, not arbitrary
    substrings. Case C05: a free employee replacement stays employee and replacement without
    inferred gifting, and a test employee order is not gifted by the fallback.'
  model: int_shopify_orders__classifications
  overrides:
    vars: {employee_email_domains: [brand.example]}
  given:
  - input: ref('stg_shopify_orders__orders')
    rows:
    - {shop_id: s, order_id: staff, source_name: web, extraction_revision: 3, is_test: false, order_email: ' Jane@Brand.Example '}
    - {shop_id: s, order_id: subdomain, source_name: web, extraction_revision: 3, is_test: false, order_email: x@mail.brand.example}
    - {shop_id: s, order_id: lookalike, source_name: web, extraction_revision: 3, is_test: false, order_email: x@notbrand.example}
    - {shop_id: s, order_id: suffix, source_name: web, extraction_revision: 3, is_test: false, order_email: x@brand.example.example}
    - {shop_id: s, order_id: c05, source_name: web, extraction_revision: 3, is_test: false, order_email: k@brand.example}
    - {shop_id: s, order_id: test_staff, source_name: web, extraction_revision: 3, is_test: true, order_email: t@brand.example}
    - {shop_id: s, order_id: swap, source_name: web, extraction_revision: 3, is_test: false, order_email: g@example.com}
    - {shop_id: s, order_id: press, source_name: web, extraction_revision: 3, is_test: false, order_email: p@brand.example}
    - {shop_id: s, order_id: view, source_name: web, extraction_revision: 3, is_test: false, order_email: v@example.com}
  - input: ref('stg_shopify_orders__order_tags')
    rows:
    - {shop_id: s, order_id: c05, normalized_tag: replacement}
    - {shop_id: s, order_id: swap, normalized_tag: exchange}
    - {shop_id: s, order_id: swap, normalized_tag: pr box}
    - {shop_id: s, order_id: press, normalized_tag: press}
    - {shop_id: s, order_id: view, normalized_tag: review}
    - {shop_id: s, order_id: view, normalized_tag: broadcast - holiday}
  - input: ref('stg_shopify_orders__order_discount_codes')
    rows:
    - {shop_id: s, order_id: swap, normalized_discount_code: free-replacement-25}
  expect:
    rows:
    - {order_id: staff, is_employee_order: true, is_gifted: null, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: subdomain, is_employee_order: false, is_gifted: false, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: lookalike, is_employee_order: false, is_gifted: false, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: suffix, is_employee_order: false, is_gifted: false, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: c05, is_employee_order: true, is_gifted: false, is_replacement: true, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: test_staff, is_employee_order: true, is_gifted: false, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: swap, is_employee_order: false, is_gifted: true, is_replacement: true, is_exchange: true, is_broadcast: false, is_d2c: true}
    - {order_id: press, is_employee_order: true, is_gifted: true, is_replacement: false, is_exchange: false, is_broadcast: false, is_d2c: true}
    - {order_id: view, is_employee_order: false, is_gifted: false, is_replacement: false, is_exchange: false, is_broadcast: true, is_d2c: true}
- name: classifications_infer_gifting_only_from_free_at_placement
  description: >
    Employee gifting requires a zero whole-order total at creation, not free merchandise,
    zero current value after a refund, or gift-card payment. Tests and replacements suppress
    only inference; explicit tags win. Missing or invalid evidence stays unknown unless
    another known condition rules out the fallback. Later edits do not change placement value.
  model: int_shopify_orders__classifications
  overrides:
    vars: {employee_email_domains: [brand.example]}
  given:
  - input: ref('stg_shopify_orders__orders')
    rows:
    - {shop_id: s, order_id: free, extraction_revision: 2, order_email: ' Staff@Brand.Example ', is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: paid, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 100, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: shipping_only, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 5, subtotal_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null}
    - {shop_id: s, order_id: refunded, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 100, current_total_price_shop_amount: 0, source_name: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: edited, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 0, current_total_price_shop_amount: 100, source_name: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: tiny_charge, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 0.000000001, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: missing, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: null, current_total_price_shop_amount: 0, source_name: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: negative, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: -1, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: old, extraction_revision: 1, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: test, extraction_revision: 4, order_email: staff@brand.example, is_test: true, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: replacement, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: exchange, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: tagged_test_replacement, extraction_revision: 4, order_email: staff@brand.example, is_test: true, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: tagged_unknown, extraction_revision: 4, order_email: null, is_test: null, original_total_price_shop_amount: null, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: unknown_test, extraction_revision: 4, order_email: staff@brand.example, is_test: null, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: no_email, extraction_revision: 4, order_email: null, is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: no_email_paid, extraction_revision: 4, order_email: null, is_test: false, original_total_price_shop_amount: 5, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: nonemployee, extraction_revision: 4, order_email: guest@example.com, is_test: false, original_total_price_shop_amount: 0, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: s, order_id: commercial, extraction_revision: 4, order_email: staff@brand.example, is_test: false, source_name: pos, original_total_price_shop_amount: 0, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
    - {shop_id: other_shop, order_id: free, extraction_revision: 4, order_email: staff@brand.example, is_test: false, original_total_price_shop_amount: 50, source_name: null, current_total_price_shop_amount: null, subtotal_price_shop_amount: null}
  - input: ref('stg_shopify_orders__order_tags')
    rows:
    - {shop_id: s, order_id: exchange, normalized_tag: exchange}
    - {shop_id: s, order_id: tagged_test_replacement, normalized_tag: replacement}
    - {shop_id: s, order_id: tagged_test_replacement, normalized_tag: gifting}
    - {shop_id: s, order_id: tagged_unknown, normalized_tag: press}
