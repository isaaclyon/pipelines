sources:
- name: shopify_orders
  description: Raw Shopify orders loaded by the dlt source in packages/ingestion.
  # Local only (ADR 0029): read the loader's raw file attached read-only.
  database: '{{ ''raw_shopify_orders'' if target.type == ''duckdb'' and env_var(''DBT_RAW_ROOT'', '''') else target.database }}'
  # The loader lowercases its schema on DuckDB; dbt relation lookups match case.
  schema: '{{ env_var(''SHOPIFY_ORDERS_DATASET'', ''SHOPIFY_ORDERS_RAW'') | lower if target.type == ''duckdb'' and env_var(''DBT_RAW_ROOT'', '''') else env_var(''SHOPIFY_ORDERS_DATASET'', ''SHOPIFY_ORDERS_RAW'') }}'
  config:
    meta: {raw_file: shopify_orders/local/shopify_orders.duckdb}
  tables:
  - name: ingestion_batches
    description: 'One row per successful ingestion run, written after its orders load. A complete refresh''s
      window_end is the instant raw orders are current to.

      '
    config:
      loaded_at_field: window_end
      freshness:
        warn_after:
          count: 25
          period: minute
        error_after:
          count: 30
          period: minute
        filter: kind = 'refresh' and status = 'complete' and completeness = 'complete'
    columns:
    - name: shop_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the shop the row was read from.
      data_type: text
    - name: batch_id
      config:
        meta: {pii: false}
      description: Dagster run ID of the ingestion run.
      data_type: text
    - name: kind
      config:
        meta: {pii: false}
      description: 'Run kind: refresh, lookback or reextract.'
      data_type: text
    - name: window_field
      config:
        meta: {pii: false}
      description: 'Order timestamp the window filters: updated_at, or created_at for reextract.'
      data_type: text
    - name: window_start
      config:
        meta: {pii: false}
      description: Inclusive UTC start of the covered window.
      data_type: timestamp
    - name: window_end
      config:
        meta: {pii: false}
      description: Exclusive UTC end of the covered window; freshness reads it.
      data_type: timestamp
    - name: status
      config:
        meta: {pii: false}
      description: Run status; complete, since only successful runs write rows.
      data_type: text
    - name: completeness
      config:
        meta: {pii: false}
      description: Window coverage; complete, since only complete windows are recorded.
      data_type: text
    - name: observation_sequence
      config:
        meta: {pii: false}
      description: Ledger-era sequence; null for runs of the dlt source.
      data_type: bigint
    - name: observed_started_at
      config:
        meta: {pii: false}
      description: UTC instant extraction started reading the window.
      data_type: timestamp
    - name: observed_finished_at
      config:
        meta: {pii: false}
      description: UTC instant extraction finished reading the window.
      data_type: timestamp
    - name: completed_at
      config:
        meta: {pii: false}
      description: UTC instant the run recorded this evidence after its load.
      data_type: timestamp
    - name: orders_observed
      config:
        meta: {pii: false}
      description: Complete orders the run read and loaded.
      data_type: bigint
    - name: orders_applied
      config:
        meta: {pii: false}
      description: Ledger-era applied count; null for runs of the dlt source.
      data_type: bigint
    - name: exceptions
      config:
        meta: {pii: false}
      description: Orders the run wrote to shopify_order_rejects.
      data_type: bigint
    - name: anomalies
      config:
        meta: {pii: false}
      description: Ledger-era anomaly count; null for runs of the dlt source.
      data_type: bigint
    - name: load_ids
      config:
        meta: {pii: false}
      description: Comma-separated dlt load IDs the run committed.
      data_type: text
    - name: api_version
      config:
        meta: {pii: false}
      description: Shopify Admin API version the run used.
      data_type: text
    - name: query_version
      config:
        meta: {pii: false}
      description: Fingerprint of the GraphQL query documents used.
      data_type: text
    - name: extraction_revision
      config:
        meta: {pii: false}
      description: Raw contract revision of the run's parser.
      data_type: bigint
  - name: orders
    description: 'One row per Shopify order, latest observed state. The dlt source merges on (shop_id,
      order_id). Money columns are DECIMAL(38, 9).

      '
    columns:
    - name: shop_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the shop the row was read from.
      data_type: text
    - name: order_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the order.
      data_type: text
    - name: name
      config:
        meta: {pii: false}
      description: 'Order name shown in Shopify, such as #1001.'
      data_type: text
    - name: created_at
      config:
        meta: {pii: false}
      description: UTC instant Shopify created the order.
      data_type: timestamp
    - name: updated_at
      config:
        meta: {pii: false}
      description: UTC instant Shopify last changed the order; the merge keeps the newest.
      data_type: timestamp
    - name: processed_at
      config:
        meta: {pii: false}
      description: UTC instant the order was processed; imports can predate creation.
      data_type: timestamp
    - name: test
      config:
        meta: {pii: false}
      description: Whether Shopify marks the order as a test order.
      data_type: bool
    - name: source_name
      config:
        meta: {pii: false}
      description: Channel or app that created the order, such as web, pos or an app ID.
      data_type: text
    - name: cancel_reason
      config:
        meta: {pii: false}
      description: Shopify cancellation reason code; null unless cancelled.
      data_type: text
    - name: cancelled_at
      config:
        meta: {pii: false}
      description: UTC instant the order was cancelled; null unless cancelled.
      data_type: timestamp
    - name: closed_at
      config:
        meta: {pii: false}
      description: UTC instant the order was closed; null while open.
      data_type: timestamp
    - name: customer_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the order's customer; null for guest orders.
      data_type: text
    - name: display_financial_status
      config:
        meta: {pii: false}
      description: Shopify financial status label, such as PAID or PARTIALLY_REFUNDED.
      data_type: text
    - name: display_fulfillment_status
      config:
        meta: {pii: false}
      description: Shopify fulfillment status label, such as FULFILLED or UNFULFILLED.
      data_type: text
    - name: currency_code
      config:
        meta: {pii: false}
      description: Shop currency code of the order's shop amounts.
      data_type: text
    - name: presentment_currency_code
      config:
        meta: {pii: false}
      description: Currency the customer saw and paid in.
      data_type: text
    - name: total_price_shop_amount
      config:
        meta: {pii: false}
      description: Original order total including tax and shipping. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: total_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of total_price_shop_amount.
      data_type: text
    - name: total_price_presentment_amount
      config:
        meta: {pii: false}
      description: Original order total including tax and shipping. Amount in the currency the customer
        saw.
      data_type: decimal(38, 9)
    - name: total_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of total_price_presentment_amount.
      data_type: text
    - name: current_total_price_shop_amount
      config:
        meta: {pii: false}
      description: Order total after edits, refunds and removals. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: current_total_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of current_total_price_shop_amount.
      data_type: text
    - name: current_total_price_presentment_amount
      config:
        meta: {pii: false}
      description: Order total after edits, refunds and removals. Amount in the currency the customer
        saw.
      data_type: decimal(38, 9)
    - name: current_total_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of current_total_price_presentment_amount.
      data_type: text
    - name: subtotal_price_shop_amount
      config:
        meta: {pii: false}
      description: Original line subtotal after discounts, before shipping and tax. Amount in the shop
        currency.
      data_type: decimal(38, 9)
    - name: subtotal_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of subtotal_price_shop_amount.
      data_type: text
    - name: subtotal_price_presentment_amount
      config:
        meta: {pii: false}
      description: Original line subtotal after discounts, before shipping and tax. Amount in the currency
        the customer saw.
      data_type: decimal(38, 9)
    - name: subtotal_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of subtotal_price_presentment_amount.
      data_type: text
    - name: current_subtotal_price_shop_amount
      config:
        meta: {pii: false}
      description: Line subtotal after edits, refunds and removals. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: current_subtotal_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of current_subtotal_price_shop_amount.
      data_type: text
    - name: current_subtotal_price_presentment_amount
      config:
        meta: {pii: false}
      description: Line subtotal after edits, refunds and removals. Amount in the currency the customer
        saw.
      data_type: decimal(38, 9)
    - name: current_subtotal_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of current_subtotal_price_presentment_amount.
      data_type: text
    - name: total_discounts_shop_amount
      config:
        meta: {pii: false}
      description: Total discounts applied to the original order; null when absent. Amount in the shop
        currency.
      data_type: decimal(38, 9)
    - name: total_discounts_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of total_discounts_shop_amount.
      data_type: text
    - name: total_discounts_presentment_amount
      config:
        meta: {pii: false}
      description: Total discounts applied to the original order; null when absent. Amount in the currency
        the customer saw.
      data_type: decimal(38, 9)
    - name: total_discounts_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of total_discounts_presentment_amount.
      data_type: text
    - name: current_total_tax_shop_amount
      config:
        meta: {pii: false}
      description: Tax after edits, refunds and removals. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: current_total_tax_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of current_total_tax_shop_amount.
      data_type: text
    - name: current_total_tax_presentment_amount
      config:
        meta: {pii: false}
      description: Tax after edits, refunds and removals. Amount in the currency the customer saw.
      data_type: decimal(38, 9)
    - name: current_total_tax_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of current_total_tax_presentment_amount.
      data_type: text
    - name: total_refunded_shop_amount
      config:
        meta: {pii: false}
      description: Total amount refunded to the customer. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: total_refunded_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of total_refunded_shop_amount.
      data_type: text
    - name: total_refunded_presentment_amount
      config:
        meta: {pii: false}
      description: Total amount refunded to the customer. Amount in the currency the customer saw.
      data_type: decimal(38, 9)
    - name: total_refunded_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of total_refunded_presentment_amount.
      data_type: text
    - name: transactions_count
      config:
        meta: {pii: false}
      description: Shopify's exact count of the order's transactions.
      data_type: bigint
    - name: transactions_count_precision
      config:
        meta: {pii: false}
      description: Precision of transactions_count; loaded orders are always EXACT.
      data_type: text
    - name: _batch_id
      config:
        meta: {pii: false}
      description: Dagster run ID of the ingestion run that loaded the row.
      data_type: text
    - name: _observation_sequence
      config:
        meta: {pii: false}
      description: Ledger-era observation order; null for rows the dlt source loads.
      data_type: bigint
    - name: _observed_at
      config:
        meta: {pii: false}
      description: UTC instant ingestion read the order's source page.
      data_type: timestamp
    - name: _extraction_kind
      config:
        meta: {pii: false}
      description: 'How the run selected the order: refresh, lookback or reextract.'
      data_type: text
    - name: _content_digest
      config:
        meta: {pii: false}
      description: Ledger-era digest of the parsed order; null for rows the dlt source loads.
      data_type: text
    - name: _query_version
      config:
        meta: {pii: false}
      description: Fingerprint of the GraphQL query documents that read the order.
      data_type: text
    - name: _extraction_revision
      config:
        meta: {pii: false}
      description: Raw contract revision that parsed the order. Columns added by a later revision are
        null on rows from an earlier one.
      data_type: bigint
    - name: _api_version
      config:
        meta: {pii: false}
      description: Shopify Admin API version that served the order.
      data_type: text
    - name: email
      config:
        meta: {pii: true}
      description: Contact email on the order. Restricted personal data.
      data_type: text
    - name: phone
      config:
        meta: {pii: true}
      description: Contact phone on the order. Restricted personal data.
      data_type: text
    - name: taxes_included
      config:
        meta: {pii: false}
      description: Whether line prices include tax.
      data_type: bool
    - name: original_total_price_shop_amount
      config:
        meta: {pii: false}
      description: Order total at creation, before any edits. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: original_total_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of original_total_price_shop_amount.
      data_type: text
    - name: original_total_price_presentment_amount
      config:
        meta: {pii: false}
      description: Order total at creation, before any edits. Amount in the currency the customer saw.
      data_type: decimal(38, 9)
    - name: original_total_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of original_total_price_presentment_amount.
      data_type: text
    - name: total_tax_shop_amount
      config:
        meta: {pii: false}
      description: Original total tax on the order. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: total_tax_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of total_tax_shop_amount.
      data_type: text
    - name: total_tax_presentment_amount
      config:
        meta: {pii: false}
      description: Original total tax on the order. Amount in the currency the customer saw.
      data_type: decimal(38, 9)
    - name: total_tax_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of total_tax_presentment_amount.
      data_type: text
    - name: total_shipping_price_shop_amount
      config:
        meta: {pii: false}
      description: Original shipping charges after shipping discounts. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: total_shipping_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of total_shipping_price_shop_amount.
      data_type: text
    - name: total_shipping_price_presentment_amount
      config:
        meta: {pii: false}
      description: Original shipping charges after shipping discounts. Amount in the currency the customer
        saw.
      data_type: decimal(38, 9)
    - name: total_shipping_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of total_shipping_price_presentment_amount.
      data_type: text
    - name: billing_address_first_name
      config:
        meta: {pii: true}
      description: First name of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_last_name
      config:
        meta: {pii: true}
      description: Last name of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_company
      config:
        meta: {pii: true}
      description: Company name of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_address1
      config:
        meta: {pii: true}
      description: First street line of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_address2
      config:
        meta: {pii: true}
      description: Second street line of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_city
      config:
        meta: {pii: false}
      description: City of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_province
      config:
        meta: {pii: false}
      description: Province or state name of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_province_code
      config:
        meta: {pii: false}
      description: Province or state code of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_zip
      config:
        meta: {pii: false}
      description: Postal code of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_country
      config:
        meta: {pii: false}
      description: Country name of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_country_code
      config:
        meta: {pii: false}
      description: ISO 3166-1 alpha-2 country code of the order's billing address; null without an address.
      data_type: text
    - name: billing_address_phone
      config:
        meta: {pii: true}
      description: Phone number of the order's billing address; null without an address.
      data_type: text
    - name: shipping_address_first_name
      config:
        meta: {pii: true}
      description: First name of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_last_name
      config:
        meta: {pii: true}
      description: Last name of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_company
      config:
        meta: {pii: true}
      description: Company name of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_address1
      config:
        meta: {pii: true}
      description: First street line of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_address2
      config:
        meta: {pii: true}
      description: Second street line of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_city
      config:
        meta: {pii: false}
      description: City of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_province
      config:
        meta: {pii: false}
      description: Province or state name of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_province_code
      config:
        meta: {pii: false}
      description: Province or state code of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_zip
      config:
        meta: {pii: false}
      description: Postal code of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_country
      config:
        meta: {pii: false}
      description: Country name of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_country_code
      config:
        meta: {pii: false}
      description: ISO 3166-1 alpha-2 country code of the order's shipping address; null without an address.
      data_type: text
    - name: shipping_address_phone
      config:
        meta: {pii: true}
      description: Phone number of the order's shipping address; null without an address.
      data_type: text
  - name: orders__lines
    description: 'One row per Shopify order line, replaced with its parent order on each merge.

      '
    columns:
    - name: shop_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the shop the row was read from.
      data_type: text
    - name: order_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the order.
      data_type: text
    - name: line_item_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the order line.
      data_type: text
    - name: sku
      config:
        meta: {pii: false}
      description: Variant SKU at purchase; null when the variant has none.
      data_type: text
    - name: name
      config:
        meta: {pii: true}
      description: Product and variant name at purchase, as Shopify displays the line.
      data_type: text
    - name: quantity
      config:
        meta: {pii: false}
      description: Units originally ordered on the line.
      data_type: bigint
    - name: current_quantity
      config:
        meta: {pii: false}
      description: Units remaining after edits and removals.
      data_type: bigint
    - name: original_unit_price_shop_amount
      config:
        meta: {pii: false}
      description: Unit price before discounts. Amount in the shop currency.
      data_type: decimal(38, 9)
    - name: original_unit_price_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of original_unit_price_shop_amount.
      data_type: text
    - name: original_unit_price_presentment_amount
      config:
        meta: {pii: false}
      description: Unit price before discounts. Amount in the currency the customer saw.
      data_type: decimal(38, 9)
    - name: original_unit_price_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of original_unit_price_presentment_amount.
      data_type: text
    - name: discounted_total_shop_amount
      config:
        meta: {pii: false}
      description: Line total after line-level discounts, before order-level allocations. Amount in the
        shop currency.
      data_type: decimal(38, 9)
    - name: discounted_total_shop_currency
      config:
        meta: {pii: false}
      description: Shop currency code of discounted_total_shop_amount.
      data_type: text
    - name: discounted_total_presentment_amount
      config:
        meta: {pii: false}
      description: Line total after line-level discounts, before order-level allocations. Amount in the
        currency the customer saw.
      data_type: decimal(38, 9)
    - name: discounted_total_presentment_currency
      config:
        meta: {pii: false}
      description: Presentment currency code of discounted_total_presentment_amount.
      data_type: text
    - name: product_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the product; null if it was deleted or is custom.
      data_type: text
    - name: variant_id
      config:
        meta: {pii: false}
      description: Shopify global ID of the variant; null if it was deleted or is custom.
      data_type: text
    - name: unfulfilled_quantity
      config:
        meta: {pii: false}
      description: Units on the line not yet fulfilled.
      data_type: bigint
    - name: non_fulfillable_quantity
      config:
        meta: {pii: false}
      description: Units on the line that cannot be fulfilled.
      data_type: bigint
    - name: requires_shipping
      config:
        meta: {pii: false}
      description: Whether the line requires shipping.
      data_type: bool
    - name: title
      config:
        meta: {pii: true}
      description: Product title at purchase.
      data_type: text
    - name: variant_title
      config:
        meta: {pii: true}
      description: Variant title at purchase.
      data_type: text
    - name: is_gift_card
      config:
        meta: {pii: false}
      description: Whether the line sells a gift card.
      data_type: bool
  - name: orders__transactions
    description: 'One row per (shop_id, order_id, transaction_id), replaced with its parent order. Includes
