          column: total_discount_amount_after_taxes_shop_currency_code
  - name: total_discount_amount_after_taxes_shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency code of the shop-money amount.
  - name: total_discount_amount_after_taxes_presentment_amount
    data_type: decimal(38, 9)
    description: Discount on the sale after taxes. Presentment-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_discount_amount_after_taxes_presentment_currency_code
  - name: total_discount_amount_after_taxes_presentment_currency_code
    config:
