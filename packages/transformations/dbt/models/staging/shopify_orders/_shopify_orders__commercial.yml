version: 2
models:
- name: stg_shopify_orders__agreements
  description: Shopify order agreements renamed and typed, one row per agreement. Instants are UTC.
  config:
    meta:
      grain: One row per (shop_id, order_id, agreement_id)
      key:
      - shop_id
      - order_id
      - agreement_id
  data_tests:
  - unique_combination:
      name: shopify_staged_agreements_unique_key
      arguments:
        columns:
        - shop_id
        - order_id
        - agreement_id
  - composite_relationship:
      name: shopify_agreements_refund_exists
      config:
        tags:
        - shopify_commercial_cross_model
      arguments:
        columns:
        - shop_id
        - order_id
        - refund_id
        to: ref('stg_shopify_orders__refunds')
        to_columns:
        - shop_id
        - order_id
        - refund_id
  columns:
  - name: shop_id
    data_type: varchar
    description: Shopify shop identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: order_id
    data_type: varchar
    description: Shopify order identity within the shop.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: agreement_id
    data_type: varchar
    description: Shopify agreement identity within the order.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: agreement_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Concrete Shopify agreement type, such as RefundAgreement.
  - name: happened_at
    data_type: timestamp
    description: When the agreement happened, in UTC.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: reason
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify agreement reason as reported.
  - name: refund_id
    data_type: varchar
    description: Refund identity for a refund agreement; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: return_id
    data_type: varchar
    description: Return identity for a return agreement; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
- name: stg_shopify_orders__agreement_sales
  description: Shopify agreement sales renamed and typed, one row per sale. Money keeps its source currencies.
  config:
    meta:
      grain: One row per (shop_id, order_id, agreement_id, sale_id)
      key:
      - shop_id
      - order_id
      - agreement_id
      - sale_id
  data_tests:
  - unique_combination:
      name: shopify_staged_agreement_sales_unique_key
      arguments:
        columns:
        - shop_id
        - order_id
        - agreement_id
        - sale_id
  - composite_relationship:
      name: shopify_agreement_sales_agreement_exists
      config:
        tags:
        - shopify_commercial_cross_model
      arguments:
        columns:
        - shop_id
        - order_id
        - agreement_id
        to: ref('stg_shopify_orders__agreements')
        to_columns:
        - shop_id
        - order_id
        - agreement_id
  - composite_relationship:
      name: shopify_agreement_sales_shipping_line_exists
      config:
        tags:
        - shopify_commercial_cross_model
      arguments:
        columns:
        - shop_id
        - order_id
        - shipping_line_id
        to: source('shopify_orders', 'orders__shipping_lines')
        to_columns:
        - shop_id
        - order_id
        - shipping_line_id
  - composite_relationship:
      name: shopify_agreement_sales_line_exists
      config:
        tags:
        - shopify_commercial_cross_model
      arguments:
        columns:
        - shop_id
        - order_id
        - line_item_id
        to: ref('stg_shopify_orders__order_lines')
        to_columns:
        - shop_id
        - order_id
        - line_item_id
  columns:
  - name: shop_id
    data_type: varchar
    description: Shopify shop identity.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: order_id
    data_type: varchar
    description: Shopify order identity within the shop.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: agreement_id
    data_type: varchar
    description: Shopify agreement identity within the order.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: sale_id
    data_type: varchar
    description: Shopify sale identity within the agreement.
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: sale_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Concrete Shopify sale type, such as ProductSale.
  - name: action_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Sale action type with whitespace removed and case normalized; unknown values remain visible.
  - name: line_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Sale line type with whitespace removed and case normalized; unknown values remain visible.
  - name: signed_quantity
    config:
      meta: {pii: false}
    data_type: bigint
    description: Signed quantity Shopify reports for the sale; null when the sale has none.
  - name: line_item_id
    data_type: varchar
    description: Order line identity for product, gift-card and tip sales; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shipping_line_id
    data_type: varchar
    description: Shipping-line identity for shipping sales; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: duty_id
    data_type: varchar
    description: Duty identity for duty sales; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: fee_id
    data_type: varchar
    description: Source fee identity for fee sales; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: fee_type
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source fee type for fee sales; null otherwise.
  - name: additional_fee_id
    data_type: varchar
    description: Additional fee identity for additional-fee sales; null otherwise.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: additional_fee_name
    config:
      meta: {pii: true}
    data_type: varchar
    description: Additional fee name; null for other sales.
  - name: additional_fee_price_shop_amount
    data_type: decimal(38, 9)
    description: Additional fee price. Shop-money amount. Null when Shopify omits this money bag.
    config:
      meta:
        pii: false
        currency:
          column: additional_fee_price_shop_currency_code
  - name: additional_fee_price_shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency code of the shop-money amount.
  - name: additional_fee_price_presentment_amount
    data_type: decimal(38, 9)
    description: Additional fee price. Presentment-money amount. Null when Shopify omits this money bag.
    config:
      meta:
        pii: false
        currency:
          column: additional_fee_price_presentment_currency_code
  - name: additional_fee_price_presentment_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Presentment currency code of the presentment-money amount.
  - name: total_amount_shop_amount
    data_type: decimal(38, 9)
    description: Total sale amount. Shop-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_amount_shop_currency_code
  - name: total_amount_shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency code of the shop-money amount.
  - name: total_amount_presentment_amount
    data_type: decimal(38, 9)
    description: Total sale amount. Presentment-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_amount_presentment_currency_code
  - name: total_amount_presentment_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Presentment currency code of the presentment-money amount.
  - name: total_tax_amount_shop_amount
    data_type: decimal(38, 9)
    description: Total tax on the sale. Shop-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_tax_amount_shop_currency_code
  - name: total_tax_amount_shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency code of the shop-money amount.
  - name: total_tax_amount_presentment_amount
    data_type: decimal(38, 9)
    description: Total tax on the sale. Presentment-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_tax_amount_presentment_currency_code
  - name: total_tax_amount_presentment_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Presentment currency code of the presentment-money amount.
  - name: total_discount_amount_before_taxes_shop_amount
    data_type: decimal(38, 9)
    description: Discount on the sale before taxes. Shop-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_discount_amount_before_taxes_shop_currency_code
  - name: total_discount_amount_before_taxes_shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency code of the shop-money amount.
  - name: total_discount_amount_before_taxes_presentment_amount
    data_type: decimal(38, 9)
    description: Discount on the sale before taxes. Presentment-money amount.
    config:
      meta:
        pii: false
        currency:
          column: total_discount_amount_before_taxes_presentment_currency_code
  - name: total_discount_amount_before_taxes_presentment_currency_code
    config:
