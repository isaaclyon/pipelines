version: 2
models:
- name: stg_shopify_customers__customers
  description: Current Shopify customers source values, without behavioral enrichment.
  config:
    meta:
      purpose: Normalize source names and UTC timestamps for current Shopify customers.
      owner: Analytics Platform
      grain: One row per shop_id, customer_id
      key: &id001
      - shop_id
      - customer_id
  data_tests:
  - unique_combination:
      name: shopify_customers_customers_unique_key
      arguments:
        columns: *id001
  columns:
  - name: shop_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify shop identity; scopes the customer source identity.
    constraints:
    - type: not_null
    data_tests:
    - not_null:
        name: stg_shopify_customers_customers_shop_id_not_null
        config:
          enabled: "{{ env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') == 'true' }}"
  - name: customer_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify customer identity within the shop.
    constraints:
    - type: not_null
    data_tests:
    - not_null:
        name: stg_shopify_customers_customers_customer_id_not_null
        config:
          enabled: "{{ env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') == 'true' }}"
  - name: legacy_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source legacy id, as reported by Shopify; no platform enrichment.
  - name: first_name
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current first name reported by Shopify; restricted personal data.
  - name: last_name
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current last name reported by Shopify; restricted personal data.
  - name: display_name
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current Shopify display name; may contain a name, email, or phone;
      restricted personal data.
  - name: locale
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source locale, as reported by Shopify; no platform enrichment.
  - name: account_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify account state; meaningful for Classic Customer Accounts.
  - name: product_subscriber_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source product subscriber status, as reported by Shopify;
      no platform enrichment.
  - name: customer_note
    config:
      meta: {pii: true}
    data_type: varchar
    description: Unstructured Shopify customer note; restricted because it can contain
      personal data.
  - name: default_address_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source default address id, as reported by Shopify; no platform
      enrichment.
  - name: email_address
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current source email address, as reported by Shopify; no platform
      enrichment.
  - name: email_marketing_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email marketing state, as reported by Shopify; no
      platform enrichment.
  - name: email_marketing_opt_in_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email marketing opt in level, as reported by Shopify;
      no platform enrichment.
  - name: email_marketing_source_location_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email marketing source location id, as reported by
      Shopify; no platform enrichment.
  - name: email_open_tracking_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email open tracking level, as reported by Shopify;
      no platform enrichment.
  - name: phone_number
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current source phone number, as reported by Shopify; no platform
      enrichment.
  - name: shopify_lifetime_spent_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Currency of the lifetime spending amount reported by Shopify.
  - name: shopify_last_order_id
    data_type: varchar
    description: Current source shopify last order id, as reported by Shopify; no
      platform enrichment.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_predicted_spend_tier
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source shopify predicted spend tier, as reported by Shopify;
      no platform enrichment.
  - name: shopify_rfm_group
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source shopify rfm group, as reported by Shopify; no platform
      enrichment.
  - name: tax_id
    config:
      meta: {pii: true}
    data_type: varchar
    description: Current source tax id, as reported by Shopify; no platform enrichment.
  - name: source_batch_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source source batch id, as reported by Shopify; no platform
      enrichment.
  - name: source_extraction_kind
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source source extraction kind, as reported by Shopify; no
      platform enrichment.
  - name: source_query_version
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source source query version, as reported by Shopify; no platform
      enrichment.
  - name: source_api_version
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source source api version, as reported by Shopify; no platform
      enrichment.
  - name: created_at
    data_type: timestamp
    description: Current source created at, as reported by Shopify; no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: updated_at
    data_type: timestamp
    description: Current source updated at, as reported by Shopify; no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: email_marketing_updated_at
    data_type: timestamp
    description: Current source email marketing updated at, as reported by Shopify;
      no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: source_observed_at
    data_type: timestamp
    description: UTC instant at which ingestion observes this source record.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: is_email_verified
    config:
      meta: {pii: false}
    data_type: boolean
    description: Shopify verification flag; admin/API-created customers can default
      to true.
  - name: is_data_sale_opted_out
    config:
      meta: {pii: false}
    data_type: boolean
    description: Current source is data sale opted out, as reported by Shopify; no
      platform enrichment.
  - name: is_tax_exempt
    config:
      meta: {pii: false}
    data_type: boolean
    description: Current source is tax exempt, as reported by Shopify; no platform
      enrichment.
  - name: is_email_format_valid
    config:
      meta: {pii: false}
    data_type: boolean
    description: Current source is email format valid, as reported by Shopify; no
      platform enrichment.
  - name: shopify_order_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Order count reported by Shopify, without platform eligibility filters;
      not a governed platform metric.
  - name: shopify_lifetime_spent_amount
    data_type: decimal(38, 9)
    description: Lifetime spending reported by Shopify, without platform revenue adjustments;
      not governed lifetime value.
    config:
      meta:
        pii: false
        currency:
          column: shopify_lifetime_spent_currency_code
  - name: source_extraction_revision
    config:
      meta: {pii: false}
    data_type: bigint
    description: Current source source extraction revision, as reported by Shopify;
      no platform enrichment.
  - name: sms_marketing_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing state, as reported by Shopify; no platform
      enrichment.
  - name: sms_marketing_opt_in_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing opt in level, as reported by Shopify;
      no platform enrichment.
  - name: sms_marketing_collected_from
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing collected from, as reported by Shopify;
      no platform enrichment.
  - name: sms_marketing_updated_at
    data_type: timestamp
    description: Current source sms marketing updated at, as reported by Shopify;
      no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: sms_marketing_source_location_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing source location id, as reported by Shopify;
      no platform enrichment.
  - name: whatsapp_marketing_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source whatsapp marketing state, as reported by Shopify;
      no platform enrichment.
  - name: whatsapp_marketing_opt_in_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source whatsapp marketing opt in level, as reported by Shopify;
      no platform enrichment.
  - name: whatsapp_marketing_collected_from
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source whatsapp marketing collected from, as reported by
      Shopify; no platform enrichment.
  - name: whatsapp_marketing_updated_at
    data_type: timestamp
    description: Current source whatsapp marketing updated at, as reported by Shopify;
      no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: whatsapp_marketing_source_location_id
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source whatsapp marketing source location id, as reported
      by Shopify; no platform enrichment.
