  - name: available_quantity
    config:
      meta: {pii: false}
    data_type: decimal(38, 9)
    description: GoodDay available units; retained without recalculation, including
      null and negative values.
  - name: ats_quantity
    config:
      meta: {pii: false}
    data_type: decimal(38, 9)
    description: GoodDay ats units; retained without recalculation, including null
