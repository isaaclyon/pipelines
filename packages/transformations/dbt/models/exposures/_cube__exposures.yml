  - name: "cube_orders"
    label: "Cube view: orders"
    type: application
    owner: {name: "Analytics Platform"}
    description: |-
      Cube view `orders`: Shopify orders at their latest known state, one row per order. Test orders are excluded; cancelled orders are included. Days are in the reporting time zone.

      Generated from `packages/metrics/model` by `scripts/platform local exposures`; do not edit by hand.

      Marts read by this definition:

      - `dim_order_contacts`
      - `fct_orders`: `SELECT * FROM fct_orders WHERE NOT is_test`

      | Cube field | Kind | Mart columns | Description |
      | --- | --- | --- | --- |
      | `orders.billing_city` | string dimension | `dim_order_contacts.billing_address_city` | Billing address city, as most recently recorded on the order |
      | `orders.billing_country_code` | string dimension | `dim_order_contacts.billing_address_country_code` | Billing address ISO country code, as most recently recorded on the order |
      | `orders.billing_postal_code` | string dimension | `dim_order_contacts.billing_address_zip` | Billing address postal code, as most recently recorded on the order |
      | `orders.billing_province_code` | string dimension | `dim_order_contacts.billing_address_province_code` | Billing address province or state code, as most recently recorded on the order |
      | `orders.cancel_reason` | string dimension | `fct_orders.cancel_reason` | Shopify cancellation reason. Null when not cancelled. |
      | `orders.cancelled_at` | time dimension | `fct_orders.cancelled_at` | When the order was cancelled, in UTC. Null when not cancelled. |
      | `orders.count` | count measure | row count | Number of orders, excluding test orders |
      | `orders.current_total_price_usd` | sum measure | `fct_orders.current_total_price_shop_amount` | Sum of order totals after edits, returns and refunds. In USD |
      | `orders.discounts_usd` | sum measure | `fct_orders.merchandise_discount_shop_amount`, `fct_orders.is_revenue_eligible` | Signed negative merchandise discounts. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.financial_status` | string dimension | `fct_orders.financial_status` | Shopify display financial status at the latest observation. Does not prove payment history. |
      | `orders.fulfillment_status` | string dimension | `fct_orders.fulfillment_status` | Shopify display fulfillment status at the latest observation. |
      | `orders.gross_ordered_quantity` | sum measure | `fct_orders.gross_ordered_quantity` | Units ordered before cancellations, removals and refunds |
      | `orders.gross_sales_usd` | sum measure | `fct_orders.gross_merchandise_shop_amount`, `fct_orders.is_revenue_eligible` | Gross merchandise sales, excluding gift-card sale value. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.has_classification_evidence` | boolean dimension | `fct_orders.has_classification_evidence` | True when the latest observation selected tags, discount codes and order email (extraction revision 2 or later). False means tag, code and email rules are unknown, so channel and characteristic flags that need them are null. |
      | `orders.is_broadcast` | boolean dimension | `fct_orders.is_broadcast` | True for a tag matching broadcast_order_tags. Broadcast orders are D2C unless a commercial rule matches. |
      | `orders.is_bulk` | boolean dimension | `fct_orders.is_bulk` | Bulk commercial channel. True with bulk evidence and no retail or specialty match. |
      | `orders.is_cancelled` | boolean dimension | `fct_orders.is_cancelled` | True when cancelled_at is set. |
      | `orders.is_commercial` | boolean dimension | `fct_orders.is_commercial` | True when the order is retail, specialty or bulk. Mutually exclusive with is_d2c; null when no commercial channel is established and evidence is unavailable. |
      | `orders.is_d2c` | boolean dimension | `fct_orders.is_d2c` | Direct-to-consumer channel, the residual of the commercial rules. True when retail, specialty and bulk were all evaluated with no match; false for commercial orders; null when commercial evidence is unavailable. Independent of revenue, refunds and metric eligibility. |
      | `orders.is_draft_order` | boolean dimension | `fct_orders.is_draft_order` | Whether source_name exactly matches shopify_draft_order; null when source_name is absent. This marker does not prove exhaustive draft-origin coverage. |
      | `orders.is_employee_order` | boolean dimension | `fct_orders.is_employee_order` | True when the order email domain is exactly one of the employee_email_domains project var, paid or free. Uses the order email, not the current customer profile. Null when the email is unavailable. |
      | `orders.is_exchange` | boolean dimension | `fct_orders.is_exchange` | True for a tag matching exchange_order_tags or a discount code matching exchange_discount_codes. Can overlap with is_replacement. |
      | `orders.is_gifted` | boolean dimension | `fct_orders.is_gifted` | True for a gifting tag or a non-test, non-replacement employee order whose original whole-order total after discounts, including shipping and tax, is zero. Later edits or refunds do not establish gifting. Null when required evidence is unavailable or invalid and no decisive condition resolves the rule. |
      | `orders.is_replacement` | boolean dimension | `fct_orders.is_replacement` | True for a tag matching replacement_order_tags or a discount code matching replacement_discount_codes. |
      | `orders.is_retail` | boolean dimension | `fct_orders.is_retail` | Retail commercial channel. Every Shopify POS order is retail; retail takes precedence over specialty and bulk. |
      | `orders.is_revenue_eligible` | boolean dimension | `fct_orders.is_revenue_eligible` | True for resolved revenue scope with verified full payment; false for any proven exclusion; null when required evidence is unknown without a proven exclusion. Does not apply AOV exclusions. |
      | `orders.is_shopify_collective` | boolean dimension | `fct_orders.is_shopify_collective` | True for a tag matching shopify_collective_order_tags. Collective orders are D2C unless a commercial rule matches. |
      | `orders.is_specialty` | boolean dimension | `fct_orders.is_specialty` | Specialty commercial channel. True with specialty evidence and no retail match. |
      | `orders.line_count` | sum measure | `fct_orders.line_count` | Number of order lines, including removed and refunded lines |
      | `orders.merchandise_refunds_usd` | sum measure | `fct_orders.merchandise_refund_shop_amount`, `fct_orders.is_revenue_eligible` | Signed negative merchandise refunds, restated on original order date. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.net_revenue_usd` | sum measure | `fct_orders.net_revenue_shop_amount`, `fct_orders.is_revenue_eligible` | Gross sales plus signed discounts and merchandise refunds plus shipping and signed shipping refunds. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.order_date` | time dimension | `fct_orders.ordered_at` | Order date in the reporting time zone; processed_at, or created_at when missing |
      | `orders.order_date_source` | string dimension | `fct_orders.order_date_source` | Which timestamp ordered_at uses: processed_at, or created_at as a fallback. |
      | `orders.order_key` | string dimension | `fct_orders.shopify_shop_id`, `fct_orders.shopify_order_id` | Shop ID and order ID joined by a slash; unique per order |
      | `orders.order_name` | string dimension | `fct_orders.order_name` | Shopify order name, the human-readable reference such as #1001. |
      | `orders.original_line_value_usd` | sum measure | `fct_orders.original_line_value_shop_amount` | Sum of quantity times original unit price, before discounts, edits or refunds; not gross sales. In USD |
      | `orders.presentment_currency_code` | string dimension | `fct_orders.presentment_currency_code` | Customer checkout currency for *_presentment_amount columns. |
      | `orders.processed_at` | time dimension | `fct_orders.processed_at` | When the order was processed, in UTC. Null when Shopify recorded none. |
      | `orders.publication_id` | string dimension | `fct_orders.publication_id` | Publication generation stamped during candidate build; null for standalone builds outside the publisher. An optional diagnostic for pairing order facts with availability evidence; not required for consumer queries. |
      | `orders.reporting_market` | string dimension | `fct_orders.reporting_market` | Reporting bucket based on latest shipping destination. A country listed in the separate_reporting_markets project var reports as itself; every other destination, including a missing country, reports in home_reporting_market. Not actual geography. |
      | `orders.revenue_exclusion_reasons` | string dimension | `fct_orders.revenue_exclusion_reasons` | All proven exclusion identifiers separated and terminated by a pipe; empty when none. Identifiers are test_order, gift_card_only and payment_not_fully_collected. |
      | `orders.revenue_unresolved_requirements` | string dimension | `fct_orders.revenue_unresolved_requirements` | All unresolved requirement identifiers separated and terminated by a pipe; empty when none. Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown, payment_chronology_unresolved and commercial_value_unknown. Retained even for excluded orders. |
      | `orders.shipping_city` | string dimension | `dim_order_contacts.shipping_address_city` | Shipping address city, as most recently recorded on the order |
      | `orders.shipping_country_code` | string dimension | `dim_order_contacts.shipping_address_country_code` | Shipping address ISO country code, as most recently recorded on the order |
      | `orders.shipping_postal_code` | string dimension | `dim_order_contacts.shipping_address_zip` | Shipping address postal code, as most recently recorded on the order |
      | `orders.shipping_province_code` | string dimension | `dim_order_contacts.shipping_address_province_code` | Shipping address province or state code, as most recently recorded on the order |
      | `orders.shipping_refunds_usd` | sum measure | `fct_orders.shipping_refund_shop_amount`, `fct_orders.is_revenue_eligible` | Signed negative shipping refunds, restated on original order date. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.shipping_revenue_usd` | sum measure | `fct_orders.shipping_shop_amount`, `fct_orders.is_revenue_eligible` | Shipping charged after shipping discounts. USD, eligible resolved orders only; excludes tests, tax and separate handling fees. Unknown evidence contributes no amount; inspect revenue_coverage |
      | `orders.shopify_customer_id` | string dimension | `fct_orders.shopify_customer_id` | Shopify customer identity. Null when the order has no linked customer. |
      | `orders.shopify_order_id` | string dimension | `fct_orders.shopify_order_id` | Shopify order identity within the shop. Part of the order key. |
      | `orders.shopify_shop_id` | string dimension | `fct_orders.shopify_shop_id` | Shopify shop identity. Part of the order key. |
      | `orders.source_name` | string dimension | `fct_orders.source_name` | Shopify source name, such as web or pos. Not a channel classification. |
      | `orders.subtotal_price_usd` | sum measure | `fct_orders.subtotal_price_shop_amount` | Sum of line subtotals after discounts, before shipping and tax. In USD |
      | `orders.total_discounts_usd` | sum measure | `fct_orders.total_discounts_shop_amount` | Sum of discounts applied to orders. In USD |
      | `orders.total_price_usd` | sum measure | `fct_orders.total_price_shop_amount` | Sum of order totals including tax and shipping, before later refunds. In USD |
      | `orders.total_refunded_usd` | sum measure | `fct_orders.total_refunded_shop_amount` | Sum of amounts refunded including tax; a reconciliation input, not a commercial refund measure. In USD |
      | `orders.total_shipping_price_usd` | sum measure | `fct_orders.total_shipping_price_shop_amount` | Sum of shipping charged after shipping discounts; orders before extraction revision 2 add nothing. In USD |
      | `orders.total_tax_usd` | sum measure | `fct_orders.total_tax_shop_amount` | Sum of tax charged on orders; orders before extraction revision 2 add nothing. In USD |
    depends_on:
      - "ref('dim_order_contacts')"
      - "ref('fct_orders')"
    config:
      enabled: "{{ ((env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') != 'true') and not (env_var('ANALYTICS_ENVIRONMENT', '') == 'local' and env_var('GOVERNED_ORDER_METRICS_ENABLED', 'false') == 'true')) }}"
