  - name: "cube_order_lines"
    label: "Cube view: order_lines"
    type: application
    owner: {name: "Analytics Platform"}
    description: |-
      Cube view `order_lines`: Source-qualified Shopify line reporting, excluding tests. Refunds and edits restate the original order day. Whole-order AOV is available only through orders, never as a line measure.

      Generated from `packages/metrics/model` by `scripts/platform local exposures`; do not edit by hand.

      Marts read by this definition:

      - `fct_order_lines`: `SELECT * FROM fct_order_lines WHERE NOT is_test`
      - `fct_orders`: `SELECT * FROM fct_orders WHERE NOT is_test`

      | Cube field | Kind | Mart columns | Description |
      | --- | --- | --- | --- |
      | `order_lines.asp_exclusion_reasons` | string dimension | `fct_order_lines.asp_exclusion_reasons` | All proven ASP exclusions, pipe-separated and terminated. Includes shared revenue and parent cancellation/gifting/replacement/exchange exclusions plus gift_card_item. Does not inherit AOV full-refund or positive-value requirements. |
      | `order_lines.asp_net_ordered_quantity` | sum measure | `fct_order_lines.net_ordered_quantity`, `fct_order_lines.is_asp_eligible` | Net ordered units of the same explicitly ASP-eligible lines as the ASP numerator. Tests are excluded; unknown evidence contributes no value, not zero |
      | `order_lines.asp_net_sales_usd` | sum measure | `fct_order_lines.net_merchandise_shop_amount`, `fct_order_lines.is_asp_eligible` | USD net merchandise sales of explicitly ASP-eligible lines, excluding shipping and tax. Tests are excluded; unknown evidence contributes no value, not zero |
      | `order_lines.asp_unresolved_requirements` | string dimension | `fct_order_lines.asp_unresolved_requirements` | All unknown ASP requirements, retained even for excluded lines; pipe-separated and terminated. Includes shared parent payment/commercial/classification requirements plus parent_eligibility_missing, gift_card_status_unknown, net_quantity_unknown and line_commercial_value_unknown. |
      | `order_lines.asp_usd` | number measure | `fct_order_lines.net_merchandise_shop_amount`, `fct_order_lines.is_asp_eligible`, `fct_order_lines.net_ordered_quantity` | USD average selling price: summed ASP-eligible net sales divided by summed eligible net ordered units; null for a zero denominator |
      | `order_lines.eligible_asp_count` | count measure | `fct_order_lines.is_asp_eligible` | Retained non-test lines with explicitly eligible for asp; counts are not estimates of missing amounts or units |
      | `order_lines.eligible_revenue_count` | count measure | `fct_order_lines.is_revenue_eligible` | Retained non-test lines with explicitly eligible for revenue; counts are not estimates of missing amounts or units |
      | `order_lines.excluded_asp_count` | count measure | `fct_order_lines.is_asp_eligible` | Retained non-test lines with proven excluded for asp; counts are not estimates of missing amounts or units |
      | `order_lines.excluded_revenue_count` | count measure | `fct_order_lines.is_revenue_eligible` | Retained non-test lines with proven excluded for revenue; counts are not estimates of missing amounts or units |
      | `order_lines.is_asp_eligible` | boolean dimension | `fct_order_lines.is_asp_eligible` | Line ASP verdict: true only for resolved paid merchandise scope, known net quantity and line sales/discount/refund allocations, with no test, cancellation, gifting, replacement or exchange exclusion. Amount-only full refunds and zero-unit residual values remain eligible. False for proven exclusion; null when required evidence is unknown. |
      | `order_lines.is_d2c` | boolean dimension | `fct_orders.is_d2c` | Direct-to-consumer channel, the residual of the commercial rules. True when retail, specialty and bulk were all evaluated with no match; false for commercial orders; null when commercial evidence is unavailable. Independent of revenue, refunds and metric eligibility. |
      | `order_lines.is_draft_order` | boolean dimension | `fct_orders.is_draft_order` | Whether source_name exactly matches shopify_draft_order; null when source_name is absent. This marker does not prove exhaustive draft-origin coverage. |
      | `order_lines.is_gift_card_item` | boolean dimension | `fct_order_lines.is_gift_card_item` | Whether the source line sells a gift card, not whether gift-card tender paid for the order. Nullable for older observations. |
      | `order_lines.is_revenue_eligible` | boolean dimension | `fct_order_lines.is_revenue_eligible` | Parent order verdict, not line eligibility. True for resolved revenue scope with verified full payment; false for any proven exclusion; null when required evidence is unknown without a proven exclusion. Does not apply AOV exclusions. |
      | `order_lines.line_key` | string dimension | `fct_order_lines.shopify_shop_id`, `fct_order_lines.shopify_order_id`, `fct_order_lines.shopify_line_item_id` | Shop, order and line source identity; unique per retained source line |
      | `order_lines.net_ordered_quantity` | sum measure | `fct_order_lines.net_ordered_quantity`, `fct_order_lines.is_revenue_eligible`, `fct_order_lines.is_gift_card_item` | Default net ordered units excluding gift-card sale units and using revenue eligibility, not ASP eligibility; quantity reductions count once and amount-only refunds do not remove units. Tests are excluded; unknown evidence contributes no value, not zero |
      | `order_lines.net_sales_usd` | sum measure | `fct_order_lines.net_merchandise_shop_amount`, `fct_order_lines.is_revenue_eligible` | USD net merchandise sales, including signed refunds, excluding shipping, tax and gift-card sale value. Tests are excluded; unknown evidence contributes no value, not zero |
      | `order_lines.order_date` | time dimension | `fct_order_lines.ordered_at` | Original order instant, processed_at with created_at fallback; reporting days use the reporting time zone |
      | `order_lines.reporting_market` | string dimension | `fct_orders.reporting_market` | Reporting bucket based on latest shipping destination. A country listed in the separate_reporting_markets project var reports as itself; every other destination, including a missing country, reports in home_reporting_market. Not actual geography. |
      | `order_lines.revenue_exclusion_reasons` | string dimension | `fct_order_lines.revenue_exclusion_reasons` | Parent order reasons. All proven exclusion identifiers separated and terminated by a pipe; empty when none. Identifiers are test_order, gift_card_only and payment_not_fully_collected. |
      | `order_lines.revenue_unresolved_requirements` | string dimension | `fct_order_lines.revenue_unresolved_requirements` | Parent order requirements. All unresolved requirement identifiers separated and terminated by a pipe; empty when none. Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown, payment_chronology_unresolved and commercial_value_unknown. Retained even for excluded orders. |
      | `order_lines.shopify_line_item_id` | string dimension | `fct_order_lines.shopify_line_item_id` | Shopify line item identity within its parent order. Part of the line key. |
      | `order_lines.shopify_order_id` | string dimension | `fct_order_lines.shopify_order_id` | Shopify order identity within the shop. Part of the order key. |
      | `order_lines.shopify_shop_id` | string dimension | `fct_order_lines.shopify_shop_id` | Shopify shop identity. Part of the order key. |
      | `order_lines.sku` | string dimension | `fct_order_lines.sku` | SKU recorded on the source order line. Nullable; not a unique line key or a catalog join requirement. |
      | `order_lines.unresolved_asp_count` | count measure | `fct_order_lines.is_asp_eligible` | Retained non-test lines with unknown eligibility for asp; counts are not estimates of missing amounts or units |
      | `order_lines.unresolved_quantity_count` | count measure | `fct_order_lines.is_revenue_eligible`, `fct_order_lines.is_gift_card_item`, `fct_order_lines.net_ordered_quantity` | Revenue-eligible non-gift-card lines with unknown net units; inspect alongside default net ordered quantity, never substitute zero |
      | `order_lines.unresolved_revenue_count` | count measure | `fct_order_lines.is_revenue_eligible` | Retained non-test lines with unknown eligibility for revenue; counts are not estimates of missing amounts or units |
    depends_on:
      - "ref('fct_order_lines')"
      - "ref('fct_orders')"
    config:
      enabled: "{{ ((env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') != 'true') and (env_var('ANALYTICS_ENVIRONMENT', '') == 'local' and env_var('GOVERNED_ORDER_METRICS_ENABLED', 'false') == 'true')) or ((env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') == 'true') and (env_var('ANALYTICS_ENVIRONMENT', '') == 'local' and env_var('GOVERNED_ORDER_METRICS_ENABLED', 'false') == 'true')) }}"
      meta:
        cube_fields:
          "order_lines.asp_exclusion_reasons": ["fct_order_lines.asp_exclusion_reasons"]
          "order_lines.asp_net_ordered_quantity": ["fct_order_lines.net_ordered_quantity","fct_order_lines.is_asp_eligible"]
          "order_lines.asp_net_sales_usd": ["fct_order_lines.net_merchandise_shop_amount","fct_order_lines.is_asp_eligible"]
          "order_lines.asp_unresolved_requirements": ["fct_order_lines.asp_unresolved_requirements"]
          "order_lines.asp_usd": ["fct_order_lines.net_merchandise_shop_amount","fct_order_lines.is_asp_eligible","fct_order_lines.net_ordered_quantity"]
          "order_lines.eligible_asp_count": ["fct_order_lines.is_asp_eligible"]
          "order_lines.eligible_revenue_count": ["fct_order_lines.is_revenue_eligible"]
          "order_lines.excluded_asp_count": ["fct_order_lines.is_asp_eligible"]
          "order_lines.excluded_revenue_count": ["fct_order_lines.is_revenue_eligible"]
          "order_lines.is_asp_eligible": ["fct_order_lines.is_asp_eligible"]
          "order_lines.is_d2c": ["fct_orders.is_d2c"]
          "order_lines.is_draft_order": ["fct_orders.is_draft_order"]
          "order_lines.is_gift_card_item": ["fct_order_lines.is_gift_card_item"]
          "order_lines.is_revenue_eligible": ["fct_order_lines.is_revenue_eligible"]
