  - name: "cube_model_classifications"
    label: "Cube model classification inventory: model_classifications"
    type: application
    owner: {name: "Analytics Platform"}
    description: |-
      Cube model classification inventory `model_classifications`: Classification validation for all Cube dimensions, including hidden and unused aliases. This inventory is not a public query interface.

      Generated from `packages/metrics/model` by `scripts/platform local exposures`; do not edit by hand.

      Marts read by this definition:

      - `dim_order_contacts`
      - `fct_data_availability`: `SELECT * FROM fct_data_availability WHERE publication_id = ( SELECT CASE WHEN COUNT(*) = 1 AND COUNT(published_at) = 1 THEN NULLIF(TRIM(MAX(publication_id)), '') ELSE NULL END FROM _publication )`
      - `fct_order_lines`: `SELECT * FROM fct_order_lines WHERE NOT is_test`
      - `fct_orders`

      | Cube field | Kind | Mart columns | Description |
      | --- | --- | --- | --- |
      | `published_data_availability.availability_id` | string dimension | `fct_data_availability.availability_id` | Shop-scoped availability record, or initial unknown record |
      | `published_data_availability.coverage_limitations` | string dimension | `fct_data_availability.coverage_limitations` | Known limitations; freshness alone does not establish metric completeness |
      | `published_data_availability.environment` | string dimension | `fct_data_availability.environment` | Explicit environment of the candidate that published these facts and evidence |
      | `published_data_availability.evidence_captured_at` | time dimension | `fct_data_availability.evidence_captured_at` | UTC candidate capture time, not source freshness or final publication time |
      | `published_data_availability.is_loop_enabled` | boolean dimension | `fct_data_availability.is_loop_enabled` | Whether this candidate reads the maintained Loop header feed |
      | `published_data_availability.is_loop_snapshot_complete` | boolean dimension | `fct_data_availability.is_loop_snapshot_complete` | Latest Loop evidence matches a successful load and current header counts; false when missing or disabled |
      | `published_data_availability.loop_snapshot_ended_at` | time dimension | `fct_data_availability.loop_snapshot_ended_at` | Latest Loop snapshot extraction endpoint, even if incomplete; not a vendor updated-at guarantee |
      | `published_data_availability.publication_id` | string dimension | `fct_data_availability.publication_id` | Optional diagnostic generation stored with this source evidence; not required for consumer queries |
      | `published_data_availability.shopify_coverage_ended_at` | time dimension | `fct_data_availability.shopify_coverage_ended_at` | Exclusive UTC end of the verified updated-at interval; null without evidence |
      | `published_data_availability.shopify_coverage_started_at` | time dimension | `fct_data_availability.shopify_coverage_started_at` | Inclusive UTC start of the latest connected verified updated-at interval; earlier gaps remain uncovered |
      | `published_data_availability.shopify_shop_id` | string dimension | `fct_data_availability.shopify_shop_id` | Source shop identity; null before any shop evidence exists |
      | `shopify_order_geography.billing_city` | string dimension | `dim_order_contacts.billing_address_city` | Billing address city, as most recently recorded on the order |
      | `shopify_order_geography.billing_country_code` | string dimension | `dim_order_contacts.billing_address_country_code` | Billing address ISO country code, as most recently recorded on the order |
      | `shopify_order_geography.billing_postal_code` | string dimension | `dim_order_contacts.billing_address_zip` | Billing address postal code, as most recently recorded on the order |
      | `shopify_order_geography.billing_province_code` | string dimension | `dim_order_contacts.billing_address_province_code` | Billing address province or state code, as most recently recorded on the order |
      | `shopify_order_geography.order_key` | string dimension | `dim_order_contacts.shopify_shop_id`, `dim_order_contacts.shopify_order_id` | Shop ID and order ID joined by a slash; unique per order |
      | `shopify_order_geography.shipping_city` | string dimension | `dim_order_contacts.shipping_address_city` | Shipping address city, as most recently recorded on the order |
      | `shopify_order_geography.shipping_country_code` | string dimension | `dim_order_contacts.shipping_address_country_code` | Shipping address ISO country code, as most recently recorded on the order |
      | `shopify_order_geography.shipping_postal_code` | string dimension | `dim_order_contacts.shipping_address_zip` | Shipping address postal code, as most recently recorded on the order |
      | `shopify_order_geography.shipping_province_code` | string dimension | `dim_order_contacts.shipping_address_province_code` | Shipping address province or state code, as most recently recorded on the order |
      | `shopify_order_lines.asp_exclusion_reasons` | string dimension | `fct_order_lines.asp_exclusion_reasons` | All proven ASP exclusions, pipe-separated and terminated. Includes shared revenue and parent cancellation/gifting/replacement/exchange exclusions plus gift_card_item. Does not inherit AOV full-refund or positive-value requirements. |
      | `shopify_order_lines.asp_unresolved_requirements` | string dimension | `fct_order_lines.asp_unresolved_requirements` | All unknown ASP requirements, retained even for excluded lines; pipe-separated and terminated. Includes shared parent payment/commercial/classification requirements plus parent_eligibility_missing, gift_card_status_unknown, net_quantity_unknown and line_commercial_value_unknown. |
      | `shopify_order_lines.is_asp_eligible` | boolean dimension | `fct_order_lines.is_asp_eligible` | Line ASP verdict: true only for resolved paid merchandise scope, known net quantity and line sales/discount/refund allocations, with no test, cancellation, gifting, replacement or exchange exclusion. Amount-only full refunds and zero-unit residual values remain eligible. False for proven exclusion; null when required evidence is unknown. |
      | `shopify_order_lines.is_gift_card_item` | boolean dimension | `fct_order_lines.is_gift_card_item` | Whether the source line sells a gift card, not whether gift-card tender paid for the order. Nullable for older observations. |
      | `shopify_order_lines.is_revenue_eligible` | boolean dimension | `fct_order_lines.is_revenue_eligible` | Parent order verdict, not line eligibility. True for resolved revenue scope with verified full payment; false for any proven exclusion; null when required evidence is unknown without a proven exclusion. Does not apply AOV exclusions. |
      | `shopify_order_lines.line_key` | string dimension | `fct_order_lines.shopify_shop_id`, `fct_order_lines.shopify_order_id`, `fct_order_lines.shopify_line_item_id` | Shop, order and line source identity; unique per retained source line |
      | `shopify_order_lines.order_date` | time dimension | `fct_order_lines.ordered_at` | Original order instant, processed_at with created_at fallback; reporting days use the reporting time zone |
      | `shopify_order_lines.revenue_exclusion_reasons` | string dimension | `fct_order_lines.revenue_exclusion_reasons` | Parent order reasons. All proven exclusion identifiers separated and terminated by a pipe; empty when none. Identifiers are test_order, gift_card_only and payment_not_fully_collected. |
      | `shopify_order_lines.revenue_unresolved_requirements` | string dimension | `fct_order_lines.revenue_unresolved_requirements` | Parent order requirements. All unresolved requirement identifiers separated and terminated by a pipe; empty when none. Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown, payment_chronology_unresolved and commercial_value_unknown. Retained even for excluded orders. |
      | `shopify_order_lines.shopify_line_item_id` | string dimension | `fct_order_lines.shopify_line_item_id` | Shopify line item identity within its parent order. Part of the line key. |
      | `shopify_order_lines.shopify_order_id` | string dimension | `fct_order_lines.shopify_order_id` | Shopify order identity within the shop. Part of the order key. |
      | `shopify_order_lines.shopify_shop_id` | string dimension | `fct_order_lines.shopify_shop_id` | Shopify shop identity. Part of the order key. |
      | `shopify_order_lines.sku` | string dimension | `fct_order_lines.sku` | SKU recorded on the source order line. Nullable; not a unique line key or a catalog join requirement. |
      | `shopify_orders.aov_exclusion_reasons` | string dimension | `fct_orders.aov_exclusion_reasons` | All proven AOV exclusions, pipe-separated and terminated; empty when none. Includes revenue exclusions plus cancelled_order, gifted_order, replacement_order, exchange_order, fully_refunded and nonpositive_commercial_value. |
      | `shopify_orders.aov_unresolved_requirements` | string dimension | `fct_orders.aov_unresolved_requirements` | All unknown AOV requirements, retained even for excluded orders. Includes revenue requirements plus revenue_evidence_missing, gifting_status_unknown, replacement_status_unknown, exchange_status_unknown, refund_status_unknown and retained_commercial_value_unknown; pipe-separated and terminated. |
      | `shopify_orders.cancel_reason` | string dimension | `fct_orders.cancel_reason` | Shopify cancellation reason. Null when not cancelled. |
      | `shopify_orders.cancelled_at` | time dimension | `fct_orders.cancelled_at` | When the order was cancelled, in UTC. Null when not cancelled. |
      | `shopify_orders.financial_status` | string dimension | `fct_orders.financial_status` | Shopify display financial status at the latest observation. Does not prove payment history. |
      | `shopify_orders.fulfillment_status` | string dimension | `fct_orders.fulfillment_status` | Shopify display fulfillment status at the latest observation. |
      | `shopify_orders.has_classification_evidence` | boolean dimension | `fct_orders.has_classification_evidence` | True when the latest observation selected tags, discount codes and order email (extraction revision 2 or later). False means tag, code and email rules are unknown, so channel and characteristic flags that need them are null. |
      | `shopify_orders.is_aov_eligible` | boolean dimension | `fct_orders.is_aov_eligible` | Whole-order AOV verdict: true only for verified paid, commercially resolved merchandise scope with known non-gifted, non-replacement, non-exchange classification, no cancellation or full refund and positive net revenue excluding tax and handling fees. False for a proven exclusion; null for unresolved requirements. |
      | `shopify_orders.is_broadcast` | boolean dimension | `fct_orders.is_broadcast` | True for a tag matching broadcast_order_tags. Broadcast orders are D2C unless a commercial rule matches. |
      | `shopify_orders.is_bulk` | boolean dimension | `fct_orders.is_bulk` | Bulk commercial channel. True with bulk evidence and no retail or specialty match. |
      | `shopify_orders.is_cancelled` | boolean dimension | `fct_orders.is_cancelled` | True when cancelled_at is set. |
      | `shopify_orders.is_commercial` | boolean dimension | `fct_orders.is_commercial` | True when the order is retail, specialty or bulk. Mutually exclusive with is_d2c; null when no commercial channel is established and evidence is unavailable. |
      | `shopify_orders.is_d2c` | boolean dimension | `fct_orders.is_d2c` | Direct-to-consumer channel, the residual of the commercial rules. True when retail, specialty and bulk were all evaluated with no match; false for commercial orders; null when commercial evidence is unavailable. Independent of revenue, refunds and metric eligibility. |
      | `shopify_orders.is_draft_order` | boolean dimension | `fct_orders.is_draft_order` | Whether source_name exactly matches shopify_draft_order; null when source_name is absent. This marker does not prove exhaustive draft-origin coverage. |
      | `shopify_orders.is_employee_order` | boolean dimension | `fct_orders.is_employee_order` | True when the order email domain is exactly one of the employee_email_domains project var, paid or free. Uses the order email, not the current customer profile. Null when the email is unavailable. |
      | `shopify_orders.is_exchange` | boolean dimension | `fct_orders.is_exchange` | True for a tag matching exchange_order_tags or a discount code matching exchange_discount_codes. Can overlap with is_replacement. |
      | `shopify_orders.is_gifted` | boolean dimension | `fct_orders.is_gifted` | True for a gifting tag or a non-test, non-replacement employee order whose original whole-order total after discounts, including shipping and tax, is zero. Later edits or refunds do not establish gifting. Null when required evidence is unavailable or invalid and no decisive condition resolves the rule. |
      | `shopify_orders.is_replacement` | boolean dimension | `fct_orders.is_replacement` | True for a tag matching replacement_order_tags or a discount code matching replacement_discount_codes. |
      | `shopify_orders.is_retail` | boolean dimension | `fct_orders.is_retail` | Retail commercial channel. Every Shopify POS order is retail; retail takes precedence over specialty and bulk. |
      | `shopify_orders.is_revenue_eligible` | boolean dimension | `fct_orders.is_revenue_eligible` | True for resolved revenue scope with verified full payment; false for any proven exclusion; null when required evidence is unknown without a proven exclusion. Does not apply AOV exclusions. |
      | `shopify_orders.is_shopify_collective` | boolean dimension | `fct_orders.is_shopify_collective` | True for a tag matching shopify_collective_order_tags. Collective orders are D2C unless a commercial rule matches. |
      | `shopify_orders.is_specialty` | boolean dimension | `fct_orders.is_specialty` | Specialty commercial channel. True with specialty evidence and no retail match. |
      | `shopify_orders.order_date` | time dimension | `fct_orders.ordered_at` | Order date in the reporting time zone; processed_at, or created_at when missing |
      | `shopify_orders.order_date_source` | string dimension | `fct_orders.order_date_source` | Which timestamp ordered_at uses: processed_at, or created_at as a fallback. |
      | `shopify_orders.order_key` | string dimension | `fct_orders.shopify_shop_id`, `fct_orders.shopify_order_id` | Shop ID and order ID joined by a slash; unique per order |
      | `shopify_orders.order_name` | string dimension | `fct_orders.order_name` | Shopify order name, the human-readable reference such as #1001. |
      | `shopify_orders.presentment_currency_code` | string dimension | `fct_orders.presentment_currency_code` | Customer checkout currency for *_presentment_amount columns. |
      | `shopify_orders.processed_at` | time dimension | `fct_orders.processed_at` | When the order was processed, in UTC. Null when Shopify recorded none. |
      | `shopify_orders.publication_id` | string dimension | `fct_orders.publication_id` | Publication generation stamped during candidate build; null for standalone builds outside the publisher. An optional diagnostic for pairing order facts with availability evidence; not required for consumer queries. |
      | `shopify_orders.reporting_market` | string dimension | `fct_orders.reporting_market` | Reporting bucket based on latest shipping destination. A country listed in the separate_reporting_markets project var reports as itself; every other destination, including a missing country, reports in home_reporting_market. Not actual geography. |
      | `shopify_orders.revenue_exclusion_reasons` | string dimension | `fct_orders.revenue_exclusion_reasons` | All proven exclusion identifiers separated and terminated by a pipe; empty when none. Identifiers are test_order, gift_card_only and payment_not_fully_collected. |
      | `shopify_orders.revenue_unresolved_requirements` | string dimension | `fct_orders.revenue_unresolved_requirements` | All unresolved requirement identifiers separated and terminated by a pipe; empty when none. Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown, payment_chronology_unresolved and commercial_value_unknown. Retained even for excluded orders. |
      | `shopify_orders.shopify_customer_id` | string dimension | `fct_orders.shopify_customer_id` | Shopify customer identity. Null when the order has no linked customer. |
      | `shopify_orders.shopify_order_id` | string dimension | `fct_orders.shopify_order_id` | Shopify order identity within the shop. Part of the order key. |
      | `shopify_orders.shopify_shop_id` | string dimension | `fct_orders.shopify_shop_id` | Shopify shop identity. Part of the order key. |
      | `shopify_orders.source_name` | string dimension | `fct_orders.source_name` | Shopify source name, such as web or pos. Not a channel classification. |
      | `shopify_revenue_coverage.aov_exclusion_reasons` | string dimension | `fct_orders.aov_exclusion_reasons` | All proven AOV exclusions, pipe-separated and terminated; empty when none. Includes revenue exclusions plus cancelled_order, gifted_order, replacement_order, exchange_order, fully_refunded and nonpositive_commercial_value. |
      | `shopify_revenue_coverage.aov_unresolved_requirements` | string dimension | `fct_orders.aov_unresolved_requirements` | All unknown AOV requirements, retained even for excluded orders. Includes revenue requirements plus revenue_evidence_missing, gifting_status_unknown, replacement_status_unknown, exchange_status_unknown, refund_status_unknown and retained_commercial_value_unknown; pipe-separated and terminated. |
      | `shopify_revenue_coverage.is_aov_eligible` | boolean dimension | `fct_orders.is_aov_eligible` | Whole-order AOV verdict: true only for verified paid, commercially resolved merchandise scope with known non-gifted, non-replacement, non-exchange classification, no cancellation or full refund and positive net revenue excluding tax and handling fees. False for a proven exclusion; null for unresolved requirements. |
      | `shopify_revenue_coverage.is_d2c` | boolean dimension | `fct_orders.is_d2c` | D2C classification, retaining null when channel evidence is missing |
      | `shopify_revenue_coverage.is_draft_order` | boolean dimension | `fct_orders.is_draft_order` | Exact shopify_draft_order source marker; null for missing source name |
      | `shopify_revenue_coverage.is_revenue_eligible` | boolean dimension | `fct_orders.is_revenue_eligible` | True eligible, false proven excluded, null unresolved |
      | `shopify_revenue_coverage.is_test` | boolean dimension | `fct_orders.is_test` | Source test-order flag; tests remain in coverage |
      | `shopify_revenue_coverage.order_date` | time dimension | `fct_orders.ordered_at` | Reporting-zone order date from processed_at with created_at fallback |
      | `shopify_revenue_coverage.order_key` | string dimension | `fct_orders.shopify_shop_id`, `fct_orders.shopify_order_id` | Shop and order source identity joined by a slash; unique per order |
      | `shopify_revenue_coverage.publication_id` | string dimension | `fct_orders.publication_id` | Optional diagnostic generation stored with these coverage facts; separate queries may observe different publications |
      | `shopify_revenue_coverage.reporting_market` | string dimension | `fct_orders.reporting_market` | Configured separate market for its shipping country; home market for other destinations and missing country, not actual geography |
      | `shopify_revenue_coverage.revenue_exclusion_reasons` | string dimension | `fct_orders.revenue_exclusion_reasons` | All proven revenue exclusions as pipe-delimited identifiers |
      | `shopify_revenue_coverage.revenue_unresolved_requirements` | string dimension | `fct_orders.revenue_unresolved_requirements` | All unknown requirements as pipe-delimited identifiers; requirement counts can overlap |
