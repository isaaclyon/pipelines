version: 2
models:
- name: dim_order_geography
  description: 'Order geography for each Shopify order: city, postal code, country and province most
    recently recorded on the order. Direct contact details stay in restricted dim_order_contacts.
    One row per order in fct_orders.'
  config:
    enabled: "{{ env_var('SHOPIFY_CUSTOMERS_ENABLED', 'false') == 'true' }}"
    meta:
      publication:
        access: analytical
        grain: One row per Shopify order, latest known state
        key: &id001
        - shopify_shop_id
        - shopify_order_id
        checks:
        - dim_order_geography_unique_order
        - dim_order_geography_match_orders
  data_tests:
  - unique_combination:
      name: dim_order_geography_unique_order
      arguments:
        columns: *id001
  columns:
  - name: shopify_shop_id
    data_type: varchar
    description: Shopify shop identity. Part of the order key.
    constraints:
    - type: not_null
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_order_id
    data_type: varchar
    description: Shopify order identity within the shop. Part of the order key.
    constraints:
    - type: not_null
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: billing_address_city
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address city, as most recently recorded on the order.
  - name: billing_address_zip
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address postal code, as most recently recorded on the order.
  - name: billing_address_province
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address province or state name, as most recently recorded on the order.
  - name: billing_address_province_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address province or state code, as most recently recorded on the order.
  - name: billing_address_country
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address country name, as most recently recorded on the order.
  - name: billing_address_country_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address ISO country code, as most recently recorded on the order.
  - name: shipping_address_city
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address city, as most recently recorded on the order.
  - name: shipping_address_zip
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address postal code, as most recently recorded on the order.
  - name: shipping_address_province
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address province or state name, as most recently recorded on the order.
  - name: shipping_address_province_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address province or state code, as most recently recorded on the order.
  - name: shipping_address_country
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address country name, as most recently recorded on the order.
  - name: shipping_address_country_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address ISO country code, as most recently recorded on the order.
