version: 2
models:
- name: fct_order_lines
  description: Shopify source order lines at their latest observed state, one row per shop, order and
    line item. Repeated product lines, test and cancelled orders remain available. Includes source product
    attributes and parent reporting context; excludes direct contact details and repeated order monetary
    totals. Adds evidence-based net ordered units, not physical return quantities. Commercial money and
    allocations remain separate work.
  config:
    meta:
      publication:
        access: analytical
        grain: One row per Shopify order line, latest observed state
        key:
        - shopify_shop_id
        - shopify_order_id
        - shopify_line_item_id
        checks:
        - fct_order_lines_unique_line
        - fct_order_lines_match_staging
        - fct_order_lines_reconcile_orders
        - shopify_published_net_units_reconcile
        - shopify_published_commercial_reconcile
        - shopify_published_average_eligibility
  data_tests:
  - unique_combination:
      name: fct_order_lines_unique_line
      arguments:
        columns:
        - shopify_shop_id
        - shopify_order_id
        - shopify_line_item_id
  columns:
  - name: shopify_shop_id
    data_type: varchar
    description: Shopify shop identity. Part of the order key.
    constraints:
    - type: not_null
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_order_id
    data_type: varchar
    description: Shopify order identity within the shop. Part of the order key.
    constraints:
    - type: not_null
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_line_item_id
    description: Shopify line item identity within its parent order. Part of the line key.
    data_type: varchar
    data_tests:
    - not_null
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
    constraints:
    - type: not_null
  - name: sku
    config:
      meta: {pii: false}
    description: SKU recorded on the source order line. Nullable; not a unique line key or a catalog join
      requirement.
    data_type: varchar
  - name: line_name
    config:
      meta: {pii: true}
    description: Combined name recorded on the source order line at its latest observation.
    data_type: varchar
  - name: title
    config:
      meta: {pii: true}
    description: Product title recorded on the source order line. Nullable for older observations; not
      a current catalog lookup.
    data_type: varchar
  - name: variant_title
    config:
      meta: {pii: true}
    description: Variant title recorded on the source order line. Nullable for older observations.
    data_type: varchar
  - name: shopify_product_id
    description: Shopify product identity recorded on the order line. Nullable for deleted or unavailable
      products.
    data_type: varchar
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_variant_id
    description: Shopify variant identity recorded on the order line. Nullable for deleted or unavailable
      variants.
    data_type: varchar
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: is_gift_card_item
    config:
      meta: {pii: false}
    description: Whether the source line sells a gift card, not whether gift-card tender paid for the
      order. Nullable for older observations.
    data_type: boolean
  - name: gross_ordered_quantity
    config:
      meta: {pii: false}
    description: Source ordered units before cancellations, removals and quantity refunds. Used by the
      parent gross quantity rollup.
    data_type: bigint
  - name: current_quantity
    config:
      meta: {pii: false}
    description: Shopify current quantity, excluding refunded and removed units. Not validated business
      net ordered quantity or physically kept quantity; cancellations can retain positive values.
    data_type: bigint
  - name: original_unit_price_shop_amount
    description: Source original unit price at the latest order observation, before discounts. Tax treatment
      follows is_tax_included; not governed gross sales. In shop (USD) currency.
    data_type: decimal(38, 9)
    config:
      meta:
        pii: false
        currency:
          column: shop_currency_code
  - name: original_unit_price_presentment_amount
    description: Source original unit price at the latest order observation, before discounts. Tax treatment
      follows is_tax_included; not governed gross sales. In presentment currency.
    data_type: decimal(38, 9)
    config:
      meta:
        pii: false
        currency:
          column: presentment_currency_code
  - name: discounted_total_shop_amount
    description: Source discounted line total; the selected Shopify field omits order-level discounts
      and does not establish net sales. In shop (USD) currency.
    data_type: decimal(38, 9)
    config:
      meta:
        pii: false
        currency:
          column: shop_currency_code
  - name: discounted_total_presentment_amount
    description: Source discounted line total; the selected Shopify field omits order-level discounts
      and does not establish net sales. In presentment currency.
    data_type: decimal(38, 9)
    config:
      meta:
        pii: false
        currency:
          column: presentment_currency_code
  - name: original_line_value_shop_amount
    data_type: decimal(38, 9)
    description: Ordered quantity times source original unit price, preserving nine decimal places. Reconciles
      to the parent original line value; not governed gross sales or net sales. In shop (USD) currency.
    config:
      meta:
        pii: false
        currency:
          column: shop_currency_code
  - name: original_line_value_presentment_amount
    data_type: decimal(38, 9)
    description: Ordered quantity times source original unit price, preserving nine decimal places. Reconciles
      to the parent original line value; not governed gross sales or net sales. In presentment currency.
    config:
      meta:
        pii: false
        currency:
          column: presentment_currency_code
  - name: order_name
    config:
      meta: {pii: false}
    data_type: varchar
    description: 'Shopify order name, the human-readable reference such as #1001.'
  - name: shopify_customer_id
    data_type: varchar
    description: Shopify customer identity. Null when the order has no linked customer.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: created_at
    data_type: timestamp
    description: When Shopify created the order, in UTC.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: processed_at
    data_type: timestamp
    description: When the order was processed, in UTC. Null when Shopify recorded none.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: updated_at
    data_type: timestamp
    description: When Shopify last updated the order, in UTC.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: cancelled_at
    data_type: timestamp
    description: When the order was cancelled, in UTC. Null when not cancelled.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: closed_at
    data_type: timestamp
    description: When the order was closed, in UTC. Null when open.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: ordered_at
    data_type: timestamp
    description: 'The instant order_date comes from, in UTC: processed_at, or created_at when Shopify
      recorded no processing time.'
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: order_date_source
    config:
      meta: {pii: false}
    data_type: varchar
    description: 'Which timestamp ordered_at uses: processed_at, or created_at as a fallback.'
  - name: order_date
    data_type: date
    description: Calendar date of ordered_at in the reporting time zone. Later refunds and edits keep this
      date (order-date basis).
    config:
      meta:
        pii: false
        temporal:
          kind: derived_date
          instant: ordered_at
          timezone: "{{ env_var('ANALYTICS_REPORTING_TIME_ZONE', 'America/Los_Angeles') }}"
          test: fct_order_lines_match_staging
  - name: cancel_reason
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify cancellation reason. Null when not cancelled.
  - name: is_test
    config:
      meta: {pii: false}
    data_type: boolean
    description: True for Shopify test orders. Test orders are retained and must be filtered by consumers.
  - name: source_name
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify source name, such as web or pos. Not a channel classification.
  - name: financial_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify display financial status at the latest observation. Does not prove payment history.
  - name: fulfillment_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify display fulfillment status at the latest observation.
  - name: is_tax_included
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when source prices include tax. Null for observations before extraction revision
      2.
  - name: shop_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shop currency for *_shop_amount columns. Tested to be USD, the reporting currency.
  - name: presentment_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Customer checkout currency for *_presentment_amount columns.
  - name: source_observed_at
    data_type: timestamp
    description: When ingestion last observed this order in Shopify, in UTC.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
          test: fct_order_lines_match_staging
  - name: is_cancelled
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when cancelled_at is set.
  - name: billing_address_city
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address city, as most recently recorded on the order.
  - name: billing_address_province
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address province or state name, as most recently recorded on the order.
  - name: billing_address_province_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address province or state code, as most recently recorded on the order.
  - name: billing_address_zip
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address postal code, as most recently recorded on the order.
  - name: billing_address_country
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address country name, as most recently recorded on the order.
  - name: billing_address_country_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Billing address ISO country code, as most recently recorded on the order.
  - name: shipping_address_city
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address city, as most recently recorded on the order.
  - name: shipping_address_province
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address province or state name, as most recently recorded on the order.
  - name: shipping_address_province_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address province or state code, as most recently recorded on the order.
  - name: shipping_address_zip
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address postal code, as most recently recorded on the order.
  - name: shipping_address_country
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address country name, as most recently recorded on the order.
  - name: shipping_address_country_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shipping address ISO country code, as most recently recorded on the order.
  - name: net_ordered_quantity
    config:
      meta: {pii: false}
    data_type: bigint
    description: Units after source refunds/removals and additional unfulfilled cancellation removal.
      Null when required evidence is unknown; not physically kept units.
  - name: net_quantity_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Source basis or unresolved reason for this line net quantity.
  - name: merchandise_discount_direct_shop_amount
    data_type: decimal(38, 9)
    description: Discount assigned directly to this line, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_allocated_shop_amount
    data_type: decimal(38, 9)
    description: Share of the discount remainder allocated to this line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_shop_amount
    data_type: decimal(38, 9)
    description: Final merchandise discount, direct plus allocated. NULL when unknown.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_discount_allocation_method
    config:
      meta: {pii: false}
    data_type: varchar
    description: How the discount was resolved, or the unresolved reason.
  - name: merchandise_refund_direct_shop_amount
    data_type: decimal(38, 9)
    description: Refund assigned directly to this line, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_allocated_shop_amount
    data_type: decimal(38, 9)
    description: Share of the refund remainder allocated to this line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_shop_amount
    data_type: decimal(38, 9)
    description: Final merchandise refund, direct plus allocated. NULL when unknown.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_refund_allocation_method
    config:
      meta: {pii: false}
    data_type: varchar
    description: How the refund was resolved, or the unresolved reason.
  - name: shipping_shop_amount
    data_type: decimal(38, 9)
    description: Allocated share of the unassigned shipping, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_allocation_method
    config:
      meta: {pii: false}
    data_type: varchar
    description: How the shipping share was resolved, or the unresolved reason.
  - name: shipping_refund_shop_amount
    data_type: decimal(38, 9)
    description: Allocated share of the unassigned shipping refund, in the shop currency.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: shipping_refund_allocation_method
    config:
      meta: {pii: false}
    data_type: varchar
    description: How the shipping refund share was resolved, or the unresolved reason.
  - name: reporting_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Governed reporting currency for every amount in this model; always USD.
  - name: unresolved_line_sale_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Number of directly assigned ledger sales that did not resolve.
  - name: line_commercial_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: resolved, unresolved_sales or no_sale_evidence.
  - name: gross_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Merchandise value before discount assigned to the line; NULL unless resolved.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: gift_card_liability_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive gift-card sale value assigned to the line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: merchandise_tax_shop_amount
    data_type: decimal(38, 9)
    description: Source tax on merchandise sales assigned to the line.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: commercial_resolution_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Parent order commercial evidence status.
  - name: allocation_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Parent order allocation status, including unknown or unallocated amounts.
  - name: net_merchandise_shop_amount
    data_type: decimal(38, 9)
    description: Tax-exclusive line merchandise after discounts and commercial refunds. Null when the
      parent commercial evidence or this line allocation is unresolved.
    config:
      meta:
        pii: false
        currency:
          column: reporting_currency_code
  - name: is_revenue_eligible
    data_type: boolean
    description: Parent order verdict, not line eligibility. True for resolved revenue scope with verified full payment; false for any proven exclusion;
      null when required evidence is unknown without a proven exclusion. Does not apply AOV exclusions.
    config:
      meta:
        pii: false
  - name: revenue_exclusion_reasons
    data_type: varchar
    description: Parent order reasons. All proven exclusion identifiers separated and terminated by a pipe; empty when none. Identifiers
      are test_order, gift_card_only and payment_not_fully_collected.
    config:
      meta:
        pii: false
  - name: revenue_unresolved_requirements
    data_type: varchar
    description: Parent order requirements. All unresolved requirement identifiers separated and terminated by a pipe; empty when none.
      Identifiers are test_status_unknown, payment_evidence_incomplete, payment_obligation_unknown, payment_chronology_unresolved
      and commercial_value_unknown. Retained even for excluded orders.
    config:
      meta:
        pii: false
  - name: is_aov_eligible
    data_type: boolean
    description: >-
      Parent whole-order AOV verdict, not a line count or average: true only for verified paid, commercially resolved merchandise scope with known non-gifted, non-replacement, non-exchange classification, no cancellation or full refund and positive net revenue excluding tax and handling fees. False for a proven exclusion; null for unresolved requirements.
    config:
      meta:
        pii: false
  - name: aov_exclusion_reasons
    data_type: varchar
    description: >-
      Parent order AOV exclusions, pipe-separated and terminated; empty when none. Includes revenue exclusions plus cancelled_order, gifted_order, replacement_order, exchange_order, fully_refunded and nonpositive_commercial_value.
    config:
      meta:
        pii: false
  - name: aov_unresolved_requirements
    data_type: varchar
    description: >-
      Parent order unknown AOV requirements, retained even for excluded orders. Includes revenue requirements plus revenue_evidence_missing, gifting_status_unknown, replacement_status_unknown, exchange_status_unknown, refund_status_unknown and retained_commercial_value_unknown; pipe-separated and terminated.
    config:
      meta:
        pii: false
  - name: is_asp_eligible
    data_type: boolean
    description: >-
      Line ASP verdict: true only for resolved paid merchandise scope, known net quantity and line sales/discount/refund allocations, with no test, cancellation, gifting, replacement or exchange exclusion. Amount-only full refunds and zero-unit residual values remain eligible. False for proven exclusion; null when required evidence is unknown.
    config:
      meta:
        pii: false
  - name: asp_exclusion_reasons
    data_type: varchar
    description: >-
      All proven ASP exclusions, pipe-separated and terminated. Includes shared revenue and parent cancellation/gifting/replacement/exchange exclusions plus gift_card_item. Does not inherit AOV full-refund or positive-value requirements.
    config:
      meta:
        pii: false
  - name: asp_unresolved_requirements
    data_type: varchar
    description: >-
      All unknown ASP requirements, retained even for excluded lines; pipe-separated and terminated. Includes shared parent payment/commercial/classification requirements plus parent_eligibility_missing, gift_card_status_unknown, net_quantity_unknown and line_commercial_value_unknown.
    config:
      meta:
        pii: false
unit_tests:
- name: order_lines_join_parents_by_shop_and_order
  description: Line item and order identifiers repeat across shops and orders, so every parent join uses
    the shop and the order. Each line takes only its own order's customer and shipping country.
  model: fct_order_lines
  given:
  - input: ref('stg_shopify_orders__order_lines')
    rows:
    - {shop_id: shop-1, order_id: '1001', line_item_id: '1'}
    - {shop_id: shop-1, order_id: '1002', line_item_id: '1'}
    - {shop_id: shop-2, order_id: '1001', line_item_id: '1'}
  - input: ref('fct_orders')
    rows:
    - {shopify_shop_id: shop-1, shopify_order_id: '1001', shopify_customer_id: customer-1}
    - {shopify_shop_id: shop-1, shopify_order_id: '1002', shopify_customer_id: null}
    - {shopify_shop_id: shop-2, shopify_order_id: '1001', shopify_customer_id: customer-2}
  - input: ref('dim_order_contacts')
    rows:
    - {shopify_shop_id: shop-1, shopify_order_id: '1001', shipping_address_country_code: US}
    - {shopify_shop_id: shop-1, shopify_order_id: '1002', shipping_address_country_code: US}
    - {shopify_shop_id: shop-2, shopify_order_id: '1001', shipping_address_country_code: CA}
  - input: ref('int_shopify_order_lines__asp_eligibility')
    rows: []
  - input: ref('int_shopify_order_lines__net_units')
    rows: []
  - input: ref('int_shopify_order_lines__allocations')
    rows: []
  - input: ref('int_shopify_order_lines__commercial_components')
    rows: []
  expect:
    rows:
    - {shopify_shop_id: shop-1, shopify_order_id: '1001', shopify_line_item_id: '1', shopify_customer_id: customer-1,
      shipping_address_country_code: US}
    - {shopify_shop_id: shop-1, shopify_order_id: '1002', shopify_line_item_id: '1', shopify_customer_id: null,
      shipping_address_country_code: US}
    - {shopify_shop_id: shop-2, shopify_order_id: '1001', shopify_line_item_id: '1', shopify_customer_id: customer-2,
      shipping_address_country_code: CA}
