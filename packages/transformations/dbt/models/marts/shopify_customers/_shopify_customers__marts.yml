version: 2
models:
- name: dim_customers
  description: Analytical current customer source data. One row per shopify_shop_id,
    shopify_customer_id. No platform behavioral enrichment.
  config:
    meta:
      publication:
        access: analytical
        grain: One row per shopify_shop_id, shopify_customer_id, latest observed state
        key: &id001
        - shopify_shop_id
        - shopify_customer_id
        checks:
        - dim_customers_unique_key
        - shopify_customers_reconcile
  data_tests:
  - unique_combination:
      name: dim_customers_unique_key
      arguments:
        columns: *id001
  columns:
  - name: shopify_shop_id
    data_type: varchar
    description: Shopify shop ID; part of the customer key.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: shopify_customer_id
    data_type: varchar
    description: Shopify customer ID within the shop; part of the customer key.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: locale
    config:
      meta: {pii: false}
    data_type: varchar
    description: Customer locale, as reported by Shopify.
  - name: account_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Shopify account state; meaningful for Classic Customer Accounts.
  - name: product_subscriber_status
    config:
      meta: {pii: false}
    data_type: varchar
    description: Product subscriber status, as reported by Shopify.
  - name: email_marketing_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email marketing state, as reported by Shopify; no
      platform enrichment.
  - name: email_marketing_opt_in_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email marketing opt in level, as reported by Shopify;
      no platform enrichment.
  - name: shopify_email_marketing_source_location_id
    data_type: varchar
    description: Current source shopify email marketing source location id, as reported
      by Shopify; no platform enrichment.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: email_open_tracking_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source email open tracking level, as reported by Shopify;
      no platform enrichment.
  - name: shopify_lifetime_spent_currency_code
    config:
      meta: {pii: false}
    data_type: varchar
    description: Currency of shopify_lifetime_spent_amount, as reported by Shopify.
  - name: shopify_last_order_id
    data_type: varchar
    description: Shopify ID of the customer's most recent order.
    config:
      meta:
        pii: false
        identity:
          kind: source
          source: shopify
  - name: shopify_predicted_spend_tier
    config:
      meta: {pii: false}
    data_type: varchar
    description: Predicted spend tier, as reported by Shopify.
  - name: shopify_rfm_group
    config:
      meta: {pii: false}
    data_type: varchar
    description: RFM (recency, frequency, monetary) group, as reported by Shopify.
  - name: created_at
    data_type: timestamp
    description: When Shopify created the customer.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: updated_at
    data_type: timestamp
    description: When Shopify last updated the customer.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: email_marketing_updated_at
    data_type: timestamp
    description: Current source email marketing updated at, as reported by Shopify;
      no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: source_observed_at
    data_type: timestamp
    description: UTC instant at which ingestion observes this source record.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: is_email_verified
    config:
      meta: {pii: false}
    data_type: boolean
    description: Shopify email verification flag; admin- or API-created customers can default to true.
  - name: is_data_sale_opted_out
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when the customer opted out of data sale, as reported by Shopify.
  - name: is_tax_exempt
    config:
      meta: {pii: false}
    data_type: boolean
    description: True when the customer is tax exempt, as reported by Shopify.
  - name: shopify_order_count
    config:
      meta: {pii: false}
    data_type: bigint
    description: Order count reported by Shopify, without platform eligibility filters;
      not a governed platform metric.
  - name: shopify_lifetime_spent_amount
    data_type: decimal(38, 9)
    description: Lifetime spending reported by Shopify, in the customer currency, without platform revenue adjustments; not governed lifetime value.
    config:
      meta:
        pii: false
        currency:
          column: shopify_lifetime_spent_currency_code
  - name: sms_marketing_state
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing state, as reported by Shopify; no platform
      enrichment.
  - name: sms_marketing_opt_in_level
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing opt in level, as reported by Shopify;
      no platform enrichment.
  - name: sms_marketing_collected_from
    config:
      meta: {pii: false}
    data_type: varchar
    description: Current source sms marketing collected from, as reported by Shopify;
      no platform enrichment.
  - name: sms_marketing_updated_at
    data_type: timestamp
    description: Current source sms marketing updated at, as reported by Shopify;
      no platform enrichment.
    config:
      meta:
        pii: false
        temporal:
          kind: instant
          timezone: UTC
  - name: shopify_sms_marketing_source_location_id
    data_type: varchar
    description: Current source shopify sms marketing source location id, as reported
