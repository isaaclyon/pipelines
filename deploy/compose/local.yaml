services:
  webserver:
    ports: ["127.0.0.1:${DAGSTER_PORT:-3000}:3000"]

  docs:
    ports: ["127.0.0.1:${DOCS_PORT:-8080}:8080"]

  cube-api:
    ports: ["127.0.0.1:${CUBE_PORT:-4000}:4000"]
    # Offline scaffold checks compilation via /meta, not warehouse readiness.
    # Remote serving retains the base /readyz probe and real credentials.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/livez').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]

  # ADR 0029: manual live loads into per-source raw DuckDB files. Credentials
  # are the developer's own, put in place outside the checkout and
  # mounted read-only. Unset paths mount an empty file and the job fails closed.
  ingestion:
    environment:
      SHOPIFY_CREDENTIALS_PATH: /run/secrets/shopify_credentials
      # Kit sources: list a source here and put its settings file,
      # <source>.json, in the mounted folder. Each job registers only then.
      ANALYTICS_SOURCES: ${ANALYTICS_SOURCES:-}
      # dlt loads DuckDB insert statements in parallel by default; one at a
      # time keeps a large live window inside the run's memory limit.
      LOAD__WORKERS: "1"
    volumes:
      - ${SHOPIFY_CREDENTIALS_HOST_PATH:-/dev/null}:/run/secrets/shopify_credentials:ro
      # Unset mounts an empty folder; enabled kit sources then fail closed.
      - ${SOURCE_SETTINGS_HOST_DIR:-./no-source-settings}:/run/secrets/sources:ro

  transformations:
    environment:
      # ADR 0029: dbt attaches each source's raw DuckDB file from ingestion
      # state, read-only. Unset (CI, tests) reads the warehouse file alone.
      DBT_RAW_ROOT: /var/lib/analytics/ingestion
      # Enable a source's models after loading its raw file.
      GOODDAY_INVENTORY_ENABLED: ${GOODDAY_INVENTORY_ENABLED:-false}
    volumes:
      - type: volume
        source: ingestion-state
        target: /var/lib/analytics/ingestion
        read_only: true

  ingestion-check:
    profiles: [checks]
    image: analytics-ingestion-check:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.python
      target: checks
      args: {PROJECT_DIR: packages/ingestion}
    environment: {FORBIDDEN_IMPORT: analytics_transformations}
    network_mode: none
    mem_limit: 2g

  transformations-check:
    profiles: [checks]
    image: analytics-transformations-check:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.python
      target: checks
      args: {PROJECT_DIR: packages/transformations}
    environment: {FORBIDDEN_IMPORT: analytics_ingestion}
    network_mode: none
    mem_limit: 2g

  metrics-check:
    profiles: [checks]
    image: analytics-metrics-check:local
    build:
      context: ../..
      dockerfile: packages/metrics/Dockerfile
      target: checks
    network_mode: none

