[project]
name = "analytics-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster==1.13.25",
    "dagster-webserver==1.13.25",
    "dagster-docker==0.29.25",
    "dagster-postgres==0.29.25",
    # Dagster 1.13.25 storage is incompatible with SQLAlchemy 2.1/psycopg3.
    "sqlalchemy==2.0.54",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["basedpyright==1.40.2", "ruff==0.16.10"]
